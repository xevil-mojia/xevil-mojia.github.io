<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0b">
<title>MoJia TimeTracker xPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>(function(){try{var s=JSON.parse(localStorage.getItem('mojia_tt_v10')||'{}');if(s.settings&&s.settings.theme)document.documentElement.dataset.theme=s.settings.theme}catch(e){}})();
window.addEventListener('error',function(e){var el=document.getElementById('error-banner');if(el){el.textContent='⚠ '+e.message;el.style.display='block';clearTimeout(window._et);window._et=setTimeout(function(){el.style.display='none'},5000)}});
</script>
<style>
:root{--fs:'Vazirmatn',system-ui,sans-serif;--fm:'JetBrains Mono',monospace;--s0:#0a0a0b;--s1:#101012;--s2:#17171a;--s3:#1e1e22;--s4:#26262b;--s5:#32323a;--t0:#fafafa;--t1:#e4e4e7;--t2:#a1a1aa;--t3:#71717a;--t4:#52525b;--brand:#ff3d5e;--brand-hi:#e11d48;--brand-soft:rgba(255,61,94,.13);--brand-glow:rgba(255,61,94,.4);--brand-grad:linear-gradient(135deg,#ff3d5e 0%,#f97316 100%);--success:#10b981;--success-soft:rgba(16,185,129,.12);--warning:#f59e0b;--warning-soft:rgba(245,158,11,.12);--info:#3b82f6;--info-soft:rgba(59,130,246,.12);--purple:#a855f7;--bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.1);--bd3:rgba(255,255,255,.16);--r6:6px;--r10:10px;--r14:14px;--r20:20px;--sw:236px;--th:60px;--h0:var(--s2);--h1:#4c1d24;--h2:#7f1d1d;--h3:#b91c1c;--h4:var(--brand)}
[data-theme="light"]{--s0:#fafafa;--s1:#fff;--s2:#f4f4f5;--s3:#e4e4e7;--s4:#d4d4d8;--s5:#a1a1aa;--t0:#09090b;--t1:#27272a;--t2:#52525b;--t3:#71717a;--t4:#a1a1aa;--bd:rgba(0,0,0,.06);--bd2:rgba(0,0,0,.1);--h0:#ebedf0;--h1:#ffd9dd;--h2:#ff9ba6;--h3:#ff5c72;--h4:var(--brand)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--s0);color:var(--t0);font-family:var(--fs);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.focus-mode .sidebar,body.focus-mode .topbar-search,body.focus-mode .topbar-stats .pill,body.focus-mode .sessions-panel,body.focus-mode .summary-bar{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
#error-banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#b91c1c;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;z-index:99999;display:none;max-width:90vw}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px;display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:var(--r14);background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;box-shadow:0 8px 32px var(--brand-glow)}
.brand-name{font-size:15px;font-weight:900;background:linear-gradient(135deg,var(--t0),var(--t2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:9px;letter-spacing:2.5px;font-family:var(--fm);font-weight:600;background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-section{padding:0 12px;margin-top:12px}
.sb-label{font-size:10px;font-weight:700;color:var(--t4);letter-spacing:1.5px;text-transform:uppercase;padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r10);color:var(--t3);font-size:13px;font-weight:500;text-align:right;position:relative;width:100%;transition:all .15s}
.nav-item:hover{color:var(--t1);background:var(--s2)}
.nav-item.active{color:var(--t0);background:var(--brand-soft)}
.nav-item.active::before{content:'';position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:var(--brand);box-shadow:0 0 12px var(--brand)}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-right:auto;font-family:var(--fm);font-size:10px;background:var(--s3);color:var(--t3);padding:1px 7px;border-radius:999px;font-weight:600;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:var(--brand);color:#fff}
.sb-spacer{flex:1}
.sb-footer{padding:14px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.sb-stat{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--t3);padding:4px 0}
.sb-stat-val{font-family:var(--fm);font-weight:700;color:var(--t1)}
.sb-links{display:flex;gap:6px;margin-top:4px}
.sb-link{flex:1;padding:6px;border-radius:var(--r6);background:var(--s2);color:var(--t3);font-size:11px;font-weight:600;text-align:center;border:1px solid var(--bd);cursor:pointer}
.sb-link:hover{background:var(--s3);color:var(--brand)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--th);flex-shrink:0;border-bottom:1px solid var(--bd);background:var(--s1);display:flex;align-items:center;padding:0 20px;gap:14px}
.topbar-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.topbar-title-mark{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
.topbar-search{flex:1;max-width:420px;height:36px;margin:0 auto;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r10);padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;cursor:pointer}
.topbar-search:hover{border-color:var(--bd3);color:var(--t2)}
.topbar-search-text{flex:1;text-align:right}
.topbar-search-kbd{font-family:var(--fm);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--s3);border:1px solid var(--bd2)}
.topbar-stats{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--t2)}
.pill-icon{font-size:12px}
.pill-val{font-family:var(--fm);font-weight:700;color:var(--t0)}
.pill.accent{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.pill.accent .pill-val{color:var(--brand)}
.pill.warning{background:var(--warning-soft);border-color:var(--warning-soft);color:var(--warning)}
.save-indicator{font-size:10px;color:var(--t3);font-family:var(--fm);opacity:0;transition:opacity .4s;pointer-events:none}
.save-indicator.show{opacity:1}
.save-indicator.saved::before{content:'✓ ';color:var(--success)}
.icon-btn{width:36px;height:36px;border-radius:var(--r10);display:inline-flex;align-items:center;justify-content:center;color:var(--t3);font-size:15px}
.icon-btn:hover{background:var(--s2);color:var(--t0)}
.icon-btn.active{background:var(--brand-soft);color:var(--brand)}
.page{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.page.active{display:flex}
.page-inner{flex:1;overflow-y:auto;padding:20px 24px;min-height:0}
.page-header{padding:16px 24px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-header-title{font-size:16px;font-weight:800}
.page-header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r10);font-size:12px;font-weight:600;border:1px solid transparent;transition:all .15s;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-xs{padding:4px 9px;font-size:10px}.btn-sm{padding:6px 12px;font-size:11px}.btn-lg{padding:12px 22px;font-size:13px;border-radius:var(--r14)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px var(--brand-glow)}
.btn-primary:hover:not(:disabled){background:var(--brand-hi)}
.btn-ghost{background:var(--s2);color:var(--t1);border-color:var(--bd)}
.btn-ghost:hover:not(:disabled){background:var(--s3);color:var(--t0)}
.btn-success{background:var(--success-soft);color:var(--success);border-color:rgba(16,185,129,.3)}
.btn-danger{background:var(--brand-soft);color:var(--brand);border-color:rgba(255,61,94,.3)}
.btn-info{background:var(--info-soft);color:var(--info);border-color:rgba(59,130,246,.3)}
.btn-icon{width:30px;height:30px;border-radius:var(--r6);display:inline-flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px}
.btn-icon:hover{background:var(--s3);color:var(--t0)}
.btn-icon.danger:hover{background:var(--brand-soft);color:var(--brand)}
.btn-icon.active{background:var(--brand-soft);color:var(--brand)}
.timer-layout{display:flex;flex:1;overflow:hidden;min-height:0}
.sessions-panel{width:264px;flex-shrink:0;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sessions-header{padding:14px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.sessions-header-row{display:flex;align-items:center;justify-content:space-between}
.sessions-title{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sessions-count{font-family:var(--fm);font-size:10px;background:var(--s3);color:var(--t3);padding:1px 6px;border-radius:999px}
.search-wrap{position:relative}
.search-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:13px;pointer-events:none}
.search-input{width:100%;height:34px;padding:0 34px 0 12px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r10);font-size:12px;color:var(--t0)}
.search-input:focus{border-color:var(--brand)}
.sessions-list{flex:1;overflow-y:auto;padding:8px}
.sess-card{padding:10px 12px;border-radius:var(--r10);cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .15s;position:relative;display:flex;flex-direction:column;gap:5px}
.sess-card:hover{background:var(--s2);border-color:var(--bd2)}
.sess-card:hover .sess-actions{opacity:1}
.sess-card.active{background:var(--brand-soft);border-color:rgba(255,61,94,.35)}
.sess-card.pinned::before{content:'';position:absolute;right:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--brand)}
.sess-card.selected{background:var(--info-soft);border-color:rgba(59,130,246,.4)}
.sess-checkbox{position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:4px;border:2px solid var(--t4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
.sess-checkbox.checked{background:var(--info);border-color:var(--info);color:#fff}
.sess-card-head{display:flex;align-items:center;gap:8px;min-width:0}
.sess-color{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sess-name{flex:1;font-size:12px;font-weight:600;color:var(--t0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.sess-actions .btn-icon{width:22px;height:22px;font-size:11px}
.sess-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--t3)}
.sess-time{font-family:var(--fm);color:var(--brand);font-weight:700}
.sess-target-bar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:2px}
.sess-target-fill{height:100%;background:var(--brand)}
.bulk-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--info-soft);border-bottom:1px solid rgba(59,130,246,.2);font-size:11px;color:var(--info)}
.bulk-bar-count{font-family:var(--fm);font-weight:700}
.timer-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.timer-hero{padding:32px 28px 24px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--bd);background:radial-gradient(ellipse 70% 60% at 50% 0%,var(--brand-soft) 0%,transparent 70%)}
.timer-mode{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);margin-bottom:16px}
.timer-mode-btn{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer}
.timer-mode-btn.active{background:var(--brand);color:#fff}
.timer-clock{font-family:var(--fm);font-size:64px;font-weight:700;color:var(--brand);letter-spacing:6px;font-variant-numeric:tabular-nums;text-shadow:0 0 50px rgba(255,61,94,.4);user-select:none;line-height:1}
.timer-clock.running{animation:clockPulse 2.5s ease-in-out infinite}
@keyframes clockPulse{0%,100%{text-shadow:0 0 50px rgba(255,61,94,.4)}50%{text-shadow:0 0 80px rgba(255,61,94,.75)}}
.timer-clock.pomodoro-running{color:var(--success);text-shadow:0 0 50px rgba(16,185,129,.5)}
.timer-clock.idle-paused{color:var(--warning)}
.timer-clock.break-mode{color:var(--info);text-shadow:0 0 50px rgba(59,130,246,.5)}
.timer-label-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.timer-status-dot{width:7px;height:7px;border-radius:50%;background:var(--t4)}
.timer-status-dot.on{background:var(--brand);box-shadow:0 0 12px var(--brand)}
.timer-status-dot.on.pomodoro{background:var(--success)}
.timer-status-dot.on.idle{background:var(--warning)}
.timer-status-dot.on.break-mode{background:var(--info)}
.timer-status-text{font-size:11px;color:var(--t3);font-weight:600;font-family:var(--fm)}
.timer-sess-pill{padding:4px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font-size:11px;color:var(--t2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-bar{padding:12px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap}
.tag-bar-label{font-size:11px;color:var(--t3);font-weight:700}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tag-chip-wrap{display:inline-flex;align-items:center;gap:2px}
.tag-chip{padding:5px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tag-chip:hover{border-color:var(--t4);color:var(--t0)}
.tag-chip.active{color:#fff;border-color:transparent}
.tag-chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag-edit-btn{width:20px;height:20px;border-radius:var(--r6);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--t4);opacity:0;cursor:pointer}
.tag-chip-wrap:hover .tag-edit-btn{opacity:1}
.ctrl-bar{padding:14px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-spacer{flex:1}
.ctrl-main{display:flex;gap:6px}
.logs-area{flex:1;overflow-y:auto;min-height:0;padding:8px 0}
.log-row{display:flex;align-items:center;gap:12px;padding:11px 28px;transition:background .15s;position:relative}
.log-row::before{content:'';position:absolute;right:0;top:8px;bottom:8px;width:3px;background:var(--log-color,var(--brand));opacity:.6;border-radius:2px}
.log-row:hover{background:var(--s1)}
.log-row:hover .log-actions{opacity:1}
.log-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-tag-name{font-size:12px;font-weight:600}
.log-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--s3);color:var(--t3);border:1px solid var(--bd);font-family:var(--fm)}
.log-note-icon{font-size:11px;color:var(--info);cursor:help}
.log-right{display:flex;align-items:center;gap:10px}
.log-time{font-family:var(--fm);font-size:14px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.log-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.log-actions .btn-icon{width:26px;height:26px;font-size:11px}
.summary-bar{padding:12px 28px;background:var(--s1);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.summary-tags{display:flex;gap:14px;flex-wrap:wrap;flex:1}
.summary-tag-item{display:flex;align-items:center;gap:5px;font-size:12px}
.summary-tag-dot{width:7px;height:7px;border-radius:50%}
.summary-tag-name{color:var(--t2)}
.summary-tag-time{font-family:var(--fm);color:var(--brand);font-weight:700}
.summary-total{font-family:var(--fm);font-size:13px;font-weight:700;padding:7px 14px;border-radius:var(--r10);background:var(--brand-soft);border:1px solid var(--brand-soft)}
.cal-header-bar{padding:16px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cal-nav-btn{width:34px;height:34px;border-radius:var(--r10);background:var(--s2);border:1px solid var(--bd);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.cal-nav-btn:hover{background:var(--s3);color:var(--t0)}
.cal-title-block{display:flex;align-items:baseline;gap:10px;flex:1;justify-content:center}
.cal-month-label{font-size:19px;font-weight:800;cursor:pointer;padding:4px 12px;border-radius:var(--r10)}
.cal-month-label:hover{background:var(--s2);color:var(--brand)}
.cal-year-label{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--brand);cursor:pointer;padding:4px 10px;border-radius:var(--r10)}
.cal-today-btn{padding:7px 14px;border-radius:var(--r10);font-size:11px;font-weight:600;background:var(--s2);border:1px solid var(--bd);color:var(--t2);cursor:pointer}
.cal-today-btn:hover{background:var(--brand-soft);color:var(--brand)}
.cal-body{flex:1;overflow-y:auto;padding:20px 24px}
.week-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.week-header{text-align:center;font-size:11px;font-weight:700;color:var(--brand);padding:6px 0}
.week-header.weekend{color:var(--t3)}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-cell{background:var(--s1);border-radius:var(--r10);padding:9px 10px;min-height:82px;position:relative;cursor:pointer;border:1px solid var(--bd);transition:all .15s}
.day-cell:hover{border-color:rgba(255,61,94,.4);background:var(--s2)}
.day-cell.today{border-color:var(--brand);background:var(--brand-soft)}
.day-cell.has-data{border-color:rgba(245,158,11,.25)}
.day-cell.frozen{border-color:rgba(59,130,246,.4);background:var(--info-soft)}
.day-cell.pick-mode:hover{border-color:var(--success)!important;background:var(--success-soft)!important}
.day-num{font-size:12px;font-weight:700;font-family:var(--fm)}
.day-cell.today .day-num{color:var(--brand)}
.day-freeze{position:absolute;top:4px;left:6px;font-size:11px}
.day-hours{font-family:var(--fm);font-size:10px;font-weight:700;background:var(--warning-soft);color:var(--warning);padding:2px 6px;border-radius:6px;margin-top:6px;display:inline-block}
.day-dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;max-height:14px;overflow:hidden}
.day-dot{width:6px;height:6px;border-radius:50%}
.day-menu{position:absolute;top:5px;left:6px;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t3);opacity:0;background:none;border:none;cursor:pointer}
.day-cell:hover .day-menu{opacity:1}
.info-banner{background:linear-gradient(90deg,var(--info-soft),transparent);border:1px solid rgba(59,130,246,.2);border-radius:var(--r10);padding:12px 18px;font-size:12px;color:var(--t2);margin-bottom:20px}
.trash-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.trash-tab{padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--bd);color:var(--t3);background:var(--s1);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.trash-tab.active{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-soft)}
.trash-count{font-family:var(--fm);font-size:10px;padding:1px 6px;border-radius:999px;background:var(--s3);color:var(--t3)}
.trash-section{display:none}.trash-section.active{display:block}
.trash-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 16px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.trash-card:hover{border-color:var(--bd2);background:var(--s2)}
.trash-info{flex:1;min-width:0}
.trash-name{font-size:13px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-meta{font-size:11px;color:var(--t3);font-family:var(--fm)}
.trash-actions{display:flex;gap:6px}
.settings-section{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);padding:20px 22px;margin-bottom:14px}
.settings-section-title{font-size:13px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.settings-section-title::after{content:'';flex:1;height:1px;background:var(--bd)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);gap:16px;flex-wrap:wrap}
.setting-row:last-child{border-bottom:none;padding-bottom:0}.setting-row:first-of-type{padding-top:0}
.setting-label{flex:1;min-width:0}
.setting-name{font-size:13px;font-weight:600}
.setting-desc{font-size:11px;color:var(--t3);margin-top:2px}
.toggle{width:42px;height:24px;border-radius:999px;background:var(--s4);position:relative;cursor:pointer;border:none}
.toggle::after{content:'';position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}
.toggle[aria-checked="true"]{background:var(--brand)}
.toggle[aria-checked="true"]::after{transform:translateX(-18px)}
.number-input{width:80px;height:34px;padding:0 10px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r10);text-align:center;font-family:var(--fm);font-size:12px;font-weight:600;color:var(--t0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(8px);padding:16px}
.modal{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r20);width:640px;max-width:100%;max-height:calc(100vh - 60px);overflow:hidden;display:flex;flex-direction:column}
.modal-sm{width:420px}.modal-md{width:520px}.modal-lg{width:760px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-title{font-size:15px;font-weight:800}
.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap}
.modal-section{margin-bottom:22px}.modal-section:last-child{margin-bottom:0}
.modal-section-title{font-size:11px;font-weight:700;color:var(--brand);letter-spacing:1.3px;margin-bottom:10px;text-transform:uppercase}
.kv-row{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:var(--s2);border-radius:var(--r6);margin-bottom:4px;font-size:12px}
.kv-label{color:var(--t2);display:flex;align-items:center;gap:7px}
.kv-val{font-weight:700;font-family:var(--fm)}
.form-input{width:100%;height:40px;padding:0 14px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r10);font-size:13px;color:var(--t0)}
.form-input:focus{border-color:var(--brand)}
textarea.form-input{height:auto;min-height:100px;padding:12px 14px;resize:vertical;line-height:1.7}
.form-hint{font-size:11px;color:var(--t3);margin:6px 0 14px;line-height:1.7}
.form-label{font-size:12px;color:var(--t2);margin-bottom:7px;font-weight:600;display:block}
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:90vw}
.toast{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:var(--r14);font-size:12px;font-weight:600;pointer-events:auto;max-width:min(90vw,480px)}
.toast.success{background:rgba(16,185,129,.95);color:#fff}.toast.error{background:rgba(225,29,72,.95);color:#fff}
.toast.info{background:rgba(59,130,246,.95);color:#fff}.toast.warning{background:rgba(245,158,11,.95);color:#fff}
.toast-icon{font-size:14px;flex-shrink:0}
.toast-msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast-action{padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.2);color:inherit;font-size:11px;font-weight:700;cursor:pointer;border:none}
.ctx-menu{position:fixed;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r10);padding:5px;z-index:2000;min-width:200px}
.ctx-item{padding:8px 12px;border-radius:var(--r6);cursor:pointer;font-size:12px;color:var(--t1);display:flex;align-items:center;gap:10px;background:none;border:none;width:100%;text-align:right}
.ctx-item:hover{background:var(--s4);color:var(--t0)}
.ctx-item.danger:hover{background:var(--brand-soft);color:var(--brand)}
.ctx-item.disabled{opacity:.35;pointer-events:none}
.ctx-item-icon{width:16px;text-align:center;font-size:12px}
.ctx-sep{height:1px;background:var(--bd);margin:4px 6px}
.palette-overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette{width:640px;max-width:92vw;background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r20);display:flex;flex-direction:column;max-height:70vh}
.palette-input-wrap{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.palette-icon{font-size:18px;color:var(--brand)}
.palette-input{flex:1;font-size:15px;color:var(--t0);background:transparent;border:none;outline:none}
.palette-kbd{font-family:var(--fm);font-size:10px;padding:3px 8px;border-radius:var(--r6);background:var(--s3);border:1px solid var(--bd2);color:var(--t3);font-weight:600}
.palette-results{overflow-y:auto;padding:8px;max-height:calc(70vh - 70px)}
.palette-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r10);cursor:pointer;color:var(--t1);font-size:13px}
.palette-item.selected{background:var(--brand-soft);color:var(--t0)}
.palette-item.selected .palette-item-icon{background:var(--brand);color:#fff}
.palette-item-icon{width:28px;height:28px;border-radius:var(--r6);background:var(--s3);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.palette-item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.palette-item-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette-item-sub{font-size:11px;color:var(--t3);font-family:var(--fm)}
.palette-empty{padding:40px 20px;text-align:center;color:var(--t3);font-size:12px}
.picker-box{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r14);padding:8px;display:grid;gap:4px;min-width:200px;max-height:55vh;overflow-y:auto}
.picker-item{padding:9px 14px;border-radius:var(--r6);cursor:pointer;font-size:13px;font-weight:600;text-align:center;color:var(--t2);background:none;border:none}
.picker-item:hover{background:var(--brand-soft);color:var(--brand)}
.picker-item.active{color:var(--brand);background:var(--brand-soft)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--t3);gap:12px;padding:40px 24px;text-align:center}
.empty-icon{font-size:48px;opacity:.15}
.empty-title{font-size:14px;font-weight:600;color:var(--t2)}
.empty-text{font-size:12px;color:var(--t4);max-width:280px;line-height:1.7}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.metric-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);padding:16px 18px}
.metric-label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.metric-value{font-family:var(--fm);font-size:24px;font-weight:800;color:var(--t0);margin-bottom:4px}
.metric-value.accent{color:var(--brand)}.metric-value.good{color:var(--success)}.metric-value.warn{color:var(--warning)}
.metric-sub{font-size:11px;color:var(--t3)}
.pdate-picker{background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r14);padding:12px;min-width:280px}
.pdate-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pdate-nav{background:var(--s3);border:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--t2);font-size:14px}
.pdate-nav:hover{background:var(--s4);color:var(--t0)}
.pdate-title{font-size:13px;font-weight:700;font-family:var(--fm)}
.pdate-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.pdate-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--fm);cursor:pointer;border-radius:6px;background:transparent;border:none;color:var(--t1);padding:0}
.pdate-cell:hover{background:var(--s3)}
.pdate-cell.pdate-header-cell{font-size:10px;color:var(--t3);cursor:default;font-weight:700}
.pdate-cell.pdate-header-cell:hover{background:transparent}
.pdate-cell.pdate-other{opacity:.3}
.pdate-cell.pdate-today{color:var(--brand);font-weight:800}
.pdate-cell.pdate-selected{background:var(--brand);color:#fff}
.compare-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);padding:18px;margin-bottom:18px}
.compare-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.compare-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px}
.compare-legend-item{display:flex;align-items:center;gap:6px}
.compare-legend-swatch{width:14px;height:3px;border-radius:2px}
.compare-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.compare-card{background:var(--s2);border-radius:var(--r10);padding:12px 14px;text-align:center}
.compare-card-label{font-size:10px;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.compare-card-val{font-family:var(--fm);font-size:20px;font-weight:800}
.compare-card-diff{font-family:var(--fm);font-size:11px;font-weight:700;margin-top:2px}
.compare-card-diff.up{color:var(--success)}.compare-card-diff.down{color:var(--brand)}
@media (max-width:720px){.sessions-panel{display:none}.timer-clock{font-size:38px;letter-spacing:2px}.timer-hero{padding:22px 16px}.tag-bar,.ctrl-bar,.summary-bar{padding-left:16px;padding-right:16px}.log-row{padding-left:16px;padding-right:16px}.cal-body,.page-inner{padding:14px 16px}.day-cell{min-height:64px;padding:6px 8px}.summary-tags{display:none}.modal{width:95vw!important}.topbar{padding:0 12px}.topbar-search-text,.topbar-search-kbd{display:none}}
</style>
</head>
<body>
<div id="error-banner"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">MoJia</div><div class="brand-sub">TIMETRACKER XPRO</div></div></div>
    <div class="sb-section"><div class="sb-label">Main</div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-page="timer"><span class="nav-icon">⏱</span><span>تایمر</span><span class="nav-badge" id="nav-badge-timer"></span></button>
        <button class="nav-item" data-page="timeline"><span class="nav-icon">📊</span><span>Timeline</span></button>
        <button class="nav-item" data-page="logs"><span class="nav-icon">📋</span><span>لاگ‌ها</span></button>
        <button class="nav-item" data-page="calendar"><span class="nav-icon">📅</span><span>تقویم</span></button>
        <button class="nav-item" data-page="journal"><span class="nav-icon">📔</span><span>ژورنال</span></button>
        <button class="nav-item" data-page="goals"><span class="nav-icon">🎯</span><span>اهداف</span><span class="nav-badge" id="nav-badge-goals"></span></button>
        <button class="nav-item" data-page="stats"><span class="nav-icon">📈</span><span>آمار</span></button>
      </nav>
    </div>
    <div class="sb-section" style="margin-top:16px"><div class="sb-label">System</div>
      <nav class="nav">
        <button class="nav-item" data-page="trash"><span class="nav-icon">🗑</span><span>سطل آشغال</span><span class="nav-badge" id="nav-badge-trash"></span></button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span>تنظیمات</span></button>
      </nav>
    </div>
    <div class="sb-spacer"></div>
    <div class="sb-footer">
      <div class="sb-stat"><span>امروز</span><span class="sb-stat-val" id="sb-today">0</span></div>
      <div class="sb-stat"><span>هفته</span><span class="sb-stat-val" id="sb-week">0</span></div>
      <div class="sb-stat"><span>Break</span><span class="sb-stat-val" id="sb-breaks">0</span></div>
      <div class="sb-links">
        <button class="sb-link" data-action="show-help">⌨ Help</button>
        <button class="sb-link" data-action="backup">💾</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title"><span class="topbar-title-mark"></span><span id="topbar-title">تایمر</span></div>
      <div class="topbar-search" id="topbar-search" role="button" tabindex="0">
        <span>🔍</span><span class="topbar-search-text">جستجو یا دستور...</span><kbd class="topbar-search-kbd">Ctrl+K</kbd>
      </div>
      <div class="topbar-stats">
        <span class="save-indicator" id="save-indicator"></span>
        <div class="pill accent" id="pill-streak"><span class="pill-icon">🔥</span><span class="pill-val" id="pill-streak-val">0</span></div>
        <div class="pill warning" id="pill-atrisk" style="display:none"><span class="pill-icon">⚠</span><span class="pill-val">هدف</span></div>
        <button class="icon-btn" id="pip-btn" title="Floating">🪟</button>
        <button class="icon-btn" id="focus-btn" title="Focus">🎯</button>
        <button class="icon-btn" id="theme-toggle" title="تم">🌙</button>
      </div>
    </header>
    <section class="page active" id="page-timer">
      <div class="timer-layout">
        <aside class="sessions-panel">
          <div class="sessions-header">
            <div class="sessions-header-row">
              <span class="sessions-title">سشن‌ها <span class="sessions-count" id="sess-count">0</span></span>
              <div style="display:flex;gap:4px">
                <button class="btn-icon" id="bulk-toggle" title="انتخاب چندتایی">☑</button>
                <button class="btn btn-primary btn-xs" data-action="new-session">+ جدید</button>
              </div>
            </div>
            <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="sess-search" placeholder="جستجو..." autocomplete="off"></div>
          </div>
          <div id="bulk-bar-container"></div>
          <div class="sessions-list" id="sessions-list"></div>
        </aside>
        <div class="timer-panel">
          <div class="timer-hero">
            <div class="timer-mode">
              <button class="timer-mode-btn active" data-timer-mode="normal">عادی</button>
              <button class="timer-mode-btn" data-timer-mode="pomodoro">🍅 پومودورو</button>
              <button class="timer-mode-btn" data-timer-mode="break">☕ استراحت</button>
            </div>
            <div class="timer-clock" id="timer-clock">00:00:00</div>
            <div class="timer-label-row">
              <span class="timer-status-dot" id="timer-status-dot"></span>
              <span class="timer-status-text" id="timer-status">آماده</span>
              <span class="timer-sess-pill" id="timer-sess-label">— بدون سشن —</span>
              <span class="timer-sess-pill" id="idle-indicator" style="display:none;background:var(--warning-soft);color:var(--warning);border-color:var(--warning-soft)">😴 idle</span>
            </div>
          </div>
          <div class="tag-bar">
            <span class="tag-bar-label">تگ:</span>
            <div class="tag-list" id="tag-list"></div>
            <button class="btn btn-ghost btn-xs" data-action="new-tag">+ تگ</button>
          </div>
          <div class="ctrl-bar">
            <div class="ctrl-main">
              <button class="btn btn-success btn-lg" id="btn-start" data-action="start">▶ شروع</button>
              <button class="btn btn-ghost btn-lg" id="btn-pause" data-action="pause" disabled>⏸ مکث</button>
              <button class="btn btn-danger btn-lg" id="btn-stop" data-action="stop" disabled>⏹ توقف</button>
            </div>
            <div class="ctrl-spacer"></div>
            <button class="btn btn-info btn-sm" data-action="quick-start">⚡ Quick-Start</button>
            <button class="btn btn-ghost btn-sm" data-action="manual-log">+ دستی</button>
            <button class="btn btn-ghost btn-sm" data-action="assign">📅 تقویم</button>
          </div>
          <div class="logs-area" id="logs-area"></div>
          <div class="summary-bar">
            <div class="summary-tags" id="summary-tags"></div>
            <div class="summary-total" id="summary-total"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="page" id="page-timeline">
      <div class="page-inner">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
          <div style="display:flex;align-items:center;gap:8px">
            <button class="cal-nav-btn" data-action="tl-prev">▶</button>
            <span style="font-size:15px;font-weight:700;font-family:var(--fm);min-width:180px;text-align:center" id="tl-date">—</span>
            <button class="cal-nav-btn" data-action="tl-next">◀</button>
            <button class="cal-today-btn" data-action="tl-today">امروز</button>
            <button class="cal-today-btn" data-action="tl-pick">📅 انتخاب</button>
          </div>
        </div>
        <div id="tl-totals" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px"></div>
        <div id="tl-wrap" style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);overflow:hidden;margin-bottom:20px"></div>
        <div id="tl-entries"></div>
      </div>
    </section>
    <section class="page" id="page-logs">
      <div class="page-header">
        <div class="page-header-title">📋 لاگ‌ها</div>
        <div class="page-header-actions">
          <button class="btn btn-ghost btn-sm" data-action="logs-clear-filters">پاک کردن فیلتر</button>
          <button class="btn btn-info btn-sm" data-action="logs-export">📊 CSV</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--bd);background:var(--s1)">
        <input class="form-input" style="width:auto;min-width:120px;height:34px" id="lf-search" placeholder="جستجو...">
        <select class="form-input" style="width:auto;height:34px" id="lf-tag"><option value="">همه تگ‌ها</option></select>
        <select class="form-input" style="width:auto;height:34px" id="lf-session"><option value="">همه سشن‌ها</option></select>
        <select class="form-input" style="width:auto;height:34px" id="lf-type">
          <option value="">همه</option><option value="auto">تایمر</option><option value="manual">دستی</option><option value="pomodoro">🍅</option>
        </select>
      </div>
      <div id="logs-summary" style="padding:10px 24px;background:var(--s1);border-bottom:1px solid var(--bd);font-size:11px;color:var(--t3)"></div>
      <div id="logs-bulk-bar"></div>
      <div class="page-inner" id="logs-list"></div>
    </section>
    <section class="page" id="page-calendar">
      <div class="cal-header-bar">
        <div style="display:flex;gap:6px">
          <button class="cal-nav-btn" data-action="cal-prev">▶</button>
          <button class="cal-nav-btn" data-action="cal-next">◀</button>
        </div>
        <div class="cal-title-block">
          <span class="cal-month-label" id="cal-month-label" data-action="pick-month"></span>
          <span class="cal-year-label" id="cal-year-label" data-action="pick-year"></span>
        </div>
        <button class="cal-today-btn" data-action="cal-today">امروز</button>
      </div>

const IDB={_db:null,_broken:false,async open(){if(this._broken)return null;if(this._db)return this._db;if(!('indexedDB'in window)){this._broken=true;return null}try{return await new Promise((res,rej)=>{const req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')};req.onsuccess=()=>{this._db=req.result;res(this._db)};req.onerror=()=>rej(req.error);req.onblocked=()=>rej(new Error('blocked'))})}catch(e){this._broken=true;return null}},async get(k){try{const db=await this.open();if(!db)return null;return await new Promise((res,rej)=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}},async set(k,v){try{const db=await this.open();if(!db)return;await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');const r=tx.objectStore('kv').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch(e){}},async del(k){try{const db=await this.open();if(!db)return;await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');const r=tx.objectStore('kv').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch(e){}}};

/* ═══════ PERSIAN DATE PICKER ═══════ */
const PDatePicker={
  show(opts){
    opts=opts||{};
    return new Promise(resolve=>{
      const initial=opts.initial||Cal.today();
      let curY=initial.y,curM=initial.m,curD=initial.d;
      const ov=document.createElement('div');
      ov.className='overlay';
      const rebuild=()=>{
        const nDays=Cal.daysInMonth(curY,curM);
        const fw=Cal.firstWeekday(curY,curM);
        let gridHTML='';
        WEEKDAYS.forEach(w=>{gridHTML+='<div class="pdate-cell pdate-header-cell">'+w+'</div>'});
        for(let i=0;i<fw;i++)gridHTML+='<div class="pdate-cell pdate-other"></div>';
        const today=Cal.today();
        for(let d=1;d<=nDays;d++){
          const isToday=today.y===curY&&today.m===curM&&today.d===d;
          const isSel=d===curD;
          let cls='pdate-cell';
          if(isToday)cls+=' pdate-today';
          if(isSel)cls+=' pdate-selected';
          gridHTML+='<button class="'+cls+'" data-day="'+d+'">'+d+'</button>';
        }
        ov.innerHTML='<div class="pdate-picker">'+
          '<div class="pdate-header">'+
            '<button class="pdate-nav" data-prev>▶</button>'+
            '<span class="pdate-title">'+MONTHS[curM-1]+' '+curY+'</span>'+
            '<button class="pdate-nav" data-next>◀</button>'+
          '</div>'+
          '<div class="pdate-grid">'+gridHTML+'</div>'+
          '<div style="display:flex;justify-content:space-between;margin-top:10px"><button class="btn btn-ghost btn-sm" data-today2>امروز</button><button class="btn btn-ghost btn-sm" data-cancel2>لغو</button></div>'+
        '</div>';
        ov.querySelector('[data-prev]').onclick=()=>{curM--;if(curM<1){curM=12;curY--;if(curY<YEAR_MIN)curY=YEAR_MIN}rebuild()};
        ov.querySelector('[data-next]').onclick=()=>{curM++;if(curM>12){curM=1;curY++;if(curY>YEAR_MAX)curY=YEAR_MAX}rebuild()};
        ov.querySelector('[data-today2]').onclick=()=>{const t=Cal.today();ov.remove();resolve({y:t.y,m:t.m,d:t.d})};
        ov.querySelector('[data-cancel2]').onclick=()=>{ov.remove();resolve(null)};
        ov.querySelectorAll('[data-day]').forEach(b=>{
          b.onclick=()=>{const d=+b.dataset.day;ov.remove();resolve({y:curY,m:curM,d:d})};
        });
      };
      rebuild();
      document.body.appendChild(ov);
      ov.addEventListener('click',e=>{if(e.target===ov){ov.remove();resolve(null)}});
    });
  }
};

Pages.Timeline={
  render(){
    const d=Store.data;const today=Cal.today();
    if(!d.ui.timelineDate||!Fmt.validDateKey(d.ui.timelineDate))d.ui.timelineDate=Fmt.dateKey(today.y,today.m,today.d);

    const dp=Fmt.parseDateKey(dk);
    const tlDate=document.getElementById('tl-date');
    if(tlDate)tlDate.textContent=Fmt.pDateFullFromDate(new Date(Cal.toGregorian(dp.y,dp.m,dp.d).gy,Cal.toGregorian(dp.y,dp.m,dp.d).gm-1,Cal.toGregorian(dp.y,dp.m,dp.d).gd));
    const dayLogs=[];
    d.sessions.forEach(s=>{
      s.logs.forEach(l=>{
        let ref=null;
        if(l.startTs)ref=new Date(l.startTs);else if(l.ts)ref=new Date(l.ts);
        if(!ref)return;
        const p=Cal.fromGregorian(ref.getFullYear(),ref.getMonth()+1,ref.getDate());
        const ldk=Fmt.dateKey(p.y,p.m,p.d);
        if(ldk===dk)dayLogs.push(Object.assign({},l,{sessionId:s.id,sessionName:s.name,sessionColor:s.color,logTime:ref,startTime:l.startTs?new Date(l.startTs):new Date(ref.getTime()-(l.seconds||l.minutes*60)*1000)}));
      });
    });
    dayLogs.sort((a,b)=>a.startTime-b.startTime);
    const totalSec=dayLogs.reduce((a,l)=>a+(l.seconds||l.minutes*60),0);
    const breaks=d.breaks.filter(b=>b.date===dk);

    const totalsEl=document.getElementById('tl-totals');

      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">جمع کل</div><div style="font-family:var(--fm);font-size:20px;font-weight:800;color:var(--brand)">'+Fmt.dur(totalSec)+'</div></div>'+
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">تعداد بلوک</div><div style="font-family:var(--fm);font-size:20px;font-weight:800">'+dayLogs.length+'</div></div>'+
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">سشن‌ها</div><div style="font-family:var(--fm);font-size:20px;font-weight:800">'+new Set(dayLogs.map(l=>l.sessionId)).size+'</div></div>'+
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">استراحت</div><div style="font-family:var(--fm);font-size:20px;font-weight:800;color:var(--info)">'+Fmt.dur(breakSec)+'</div></div>';

      wrap.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:140px;gap:8px;color:var(--t3)"><div style="font-size:40px;opacity:.2">📭</div><div>این روز لاگی نداره</div></div>';
    }else{
      let html='<div style="display:flex;padding:6px 0;border-bottom:1px solid var(--bd);background:var(--s2)">';

          const row=document.createElement('div');

          row.style.cursor='pointer';
          row.innerHTML='<div class="trash-info"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="width:10px;height:10px;border-radius:3px;background:'+c+'"></span><strong style="font-size:13px">'+Fmt.esc(l.tag)+'</strong><span style="font-size:11px;color:var(--t3)">'+Fmt.esc(l.sessionName)+'</span></div><div class="trash-meta">'+Fmt.pTimeShort(l.startTime.toISOString())+' - '+(l.endTs?Fmt.pTimeShort(l.endTs):'—')+'</div></div><div style="font-family:var(--fm);font-weight:700;color:var(--brand)">'+Fmt.dur(l.seconds||l.minutes*60)+'</div>';

/* ═══════ LOGS PAGE ═══════ */
Pages.Logs={
  _selected:new Set(),_t:null,
  render(){
    const tagSel=document.getElementById('lf-tag');const sessSel=document.getElementById('lf-session');
    if(!tagSel||!sessSel)return;
    const curTag=tagSel.value,curSess=sessSel.value;
    tagSel.innerHTML='<option value="">همه تگ‌ها</option>'+Store.data.tags.map(t=>'<option value="'+Fmt.esc(t)+'">'+Fmt.esc(t)+'</option>').join('');
    sessSel.innerHTML='<option value="">همه سشن‌ها</option>'+Store.data.sessions.map(s=>'<option value="'+s.id+'">'+Fmt.esc(s.name)+'</option>').join('');
    tagSel.value=curTag;sessSel.value=curSess;
    this._applyFilters();
  },
  _applyFilters(){
    const search=(document.getElementById('lf-search').value||'').trim().toLowerCase();
    const tag=document.getElementById('lf-tag').value;
    const sessId=document.getElementById('lf-session').value;
    const type=document.getElementById('lf-type').value;
    let logs=Store.allLogs();
    if(search)logs=logs.filter(l=>{const hay=(l.tag+' '+(l.note||'')+' '+l.sessionName).toLowerCase();return hay.includes(search)});
    if(tag)logs=logs.filter(l=>l.tag===tag);
    if(sessId)logs=logs.filter(l=>l.sessionId===+sessId);
    if(type==='manual')logs=logs.filter(l=>l.manual);
    else if(type==='auto')logs=logs.filter(l=>!l.manual&&!l.pomodoro);
    else if(type==='pomodoro')logs=logs.filter(l=>l.pomodoro);
    logs.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    const totalSec=logs.reduce((a,l)=>a+(l.seconds||l.minutes*60),0);
    const sumEl=document.getElementById('logs-summary');
    if(sumEl)sumEl.innerHTML='<span>📊 تعداد: <span style="font-family:var(--fm);color:var(--t0);font-weight:700">'+logs.length+'</span></span><span style="margin-right:16px">⏱ جمع: <span style="font-family:var(--fm);color:var(--t0);font-weight:700">'+Fmt.dur(totalSec)+'</span></span>';
    const bb=document.getElementById('logs-bulk-bar');
    if(bb){
      if(this._selected.size>0){
        bb.innerHTML='<div class="bulk-bar"><span>'+this._selected.size+' انتخاب شده</span><div style="flex:1"></div><button class="btn btn-info btn-xs" data-bulk-tag>🏷</button><button class="btn btn-info btn-xs" data-bulk-move>↗</button><button class="btn btn-danger btn-xs" data-bulk-del>🗑</button><button class="btn btn-ghost btn-xs" data-bulk-clear>لغو</button></div>';
        bb.querySelector('[data-bulk-del]').onclick=()=>this.bulkDelete();
        bb.querySelector('[data-bulk-tag]').onclick=()=>this.bulkChangeTag();
        bb.querySelector('[data-bulk-move]').onclick=()=>this.bulkMove();
        bb.querySelector('[data-bulk-clear]').onclick=()=>{this._selected.clear();this._applyFilters()};
      }else bb.innerHTML='';
    }
    const list=document.getElementById('logs-list');if(!list)return;
    list.innerHTML='';
    if(!logs.length){list.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">نتیجه‌ای نیست</div></div>';return}
    const self=this;
    logs.forEach(l=>{
      const c=Store.data.tagColors[l.tag]||'#ff3d5e';
      const isSel=this._selected.has(l.id);
      const item=document.createElement('div');
      item.className='trash-card'+(isSel?' selected':'');
      const dateStr=l.ts?Fmt.pDateFromDate(new Date(l.ts)):'';
      const timeStr=l.ts?Fmt.pTimeShort(l.ts):'';
      item.innerHTML=
        '<div style="width:18px;height:18px;border-radius:4px;border:2px solid '+(isSel?'var(--info)':'var(--t4)')+';display:flex;align-items:center;justify-content:center;font-size:10px;color:'+(isSel?'#fff':'transparent')+';background:'+(isSel?'var(--info)':'transparent')+';cursor:pointer;flex-shrink:0" data-ch>'+(isSel?'✓':'')+'</div>'+
        '<div class="trash-info">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">'+
            '<span style="padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:'+c+'20;color:'+c+'">'+Fmt.esc(l.tag)+'</span>'+
            '<span style="font-size:11px;color:var(--t3)">'+Fmt.esc(l.sessionName)+'</span>'+
            (l.manual?'<span class="log-badge">دستی</span>':'')+
            (l.pomodoro?'<span class="log-badge">🍅</span>':'')+
          '</div>'+
          (l.note?'<div style="font-size:11px;color:var(--t2);font-style:italic">📝 '+Fmt.esc(l.note)+'</div>':'')+
          '<div class="trash-meta">'+dateStr+' · '+timeStr+'</div>'+
        '</div>'+
        '<div style="font-family:var(--fm);font-size:14px;font-weight:700;color:var(--brand)">'+Fmt.dur(l.seconds||l.minutes*60)+'</div>';
      item.querySelector('[data-ch]').onclick=e=>{e.stopPropagation();if(self._selected.has(l.id))self._selected.delete(l.id);else self._selected.add(l.id);self._applyFilters()};
      item.onclick=()=>{Store.data.ui.activeSessionId=l.sessionId;Store.save();Router.go('timer')};
      list.appendChild(item);
    });
  },
  async bulkDelete(){const ids=[...this._selected];if(!ids.length)return;const ok=await Modal.confirm('حذف',ids.length+' لاگ حذف بشن؟',{danger:true,confirmText:'حذف'});if(!ok)return;const now=new Date().toISOString();const removed=[];Store.data.sessions.forEach(s=>{for(let i=s.logs.length-1;i>=0;i--){if(ids.includes(s.logs[i].id)){const l=s.logs.splice(i,1)[0];Store.data.trash.logs.push(Object.assign({},l,{sessionId:s.id,sessionName:s.name,deletedAt:now}));removed.push({log:l,sessionId:s.id,idx:i})}}});this._selected.clear();await Store.saveNow();this.render();UI.updateGlobalStats();Toast.undo(removed.length+' حذف شد',()=>{removed.forEach(item=>{const ti=Store.data.trash.logs.findIndex(x=>x.id===item.log.id);if(ti<0)return;const r=Store.data.trash.logs.splice(ti,1)[0];delete r.deletedAt;delete r.sessionId;delete r.sessionName;const s=Store.data.sessions.find(x=>x.id===item.sessionId);if(s)s.logs.push(r)});Store.save();this.render();UI.updateGlobalStats()})},
  async bulkChangeTag(){const ids=[...this._selected];if(!ids.length)return;if(!Store.data.tags.length){Toast.info('اول تگ بساز');return}const items=Store.data.tags.map(t=>({label:t,value:t}));const newTag=await Modal.picker(items,null,2);if(!newTag)return;let count=0;Store.data.sessions.forEach(s=>{s.logs.forEach(l=>{if(ids.includes(l.id)){l.tag=newTag;count++}})});this._selected.clear();await Store.saveNow();this.render();Toast.success(count+' لاگ تغییر یافت')},
  async bulkMove(){const ids=[...this._selected];if(!ids.length)return;if(!Store.data.sessions.length){Toast.info('سشنی نیست');return}const items=Store.data.sessions.map(s=>({label:s.name,value:s.id}));const targetId=await Modal.picker(items,null,1);if(!targetId)return;const target=Store.data.sessions.find(x=>x.id===targetId);if(!target)return;let count=0;Store.data.sessions.forEach(s=>{if(s.id===targetId)return;for(let i=s.logs.length-1;i>=0;i--){if(ids.includes(s.logs[i].id)){target.logs.push(s.logs.splice(i,1)[0]);count++}}});this._selected.clear();await Store.saveNow();this.render();UI.updateGlobalStats();Toast.success(count+' منتقل شد')},
  clearFilters(){document.getElementById('lf-search').value='';document.getElementById('lf-tag').value='';document.getElementById('lf-session').value='';document.getElementById('lf-type').value='';this._selected.clear();this._applyFilters()},
  exportCSV(){
    const logs=Store.allLogs();
    const h=['تاریخ شمسی','ساعت','سشن','تگ','دقیقه','ثانیه','یادداشت','نوع'].map(v=>'"'+v+'"').join(',');
    const rows=logs.map(l=>{
      const d=l.ts?new Date(l.ts):null;
      const ds=d?Fmt.pDateFromDate(d):'';
      const ts=d?Fmt.pTimeShort(l.ts):'';
      const tp=l.manual?'دستی':l.pomodoro?'پومودورو':'تایمر';
      return[ds,ts,l.sessionName,l.tag,l.minutes||0,l.seconds||((l.minutes||0)*60),l.note||'',tp].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',');
    });
    const blob=new Blob(['\ufeff'+[h].concat(rows).join('\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='logs_'+Date.now()+'.csv';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),100);
    Toast.success('CSV ذخیره شد');
  }
};

  pickMode:null,

  async pickMonth(){const items=MONTHS.map((mn,i)=>({label:mn,value:i+1}));const v=await Modal.picker(items,Store.data.ui.calM,3);if(v){Store.data.ui.calM=v;Store.save();this.render()}},

      {sep:true},
      {icon:'🧊',label:frozen?'حذف Freeze':'Freeze ('+freezesLeft+')',disabled:!frozen&&freezesLeft<=0,fn:()=>this.toggleFreeze(dk)},
      {sep:true},
      {icon:'🗑',label:'پاک‌سازی روز',cls:'danger',disabled:!logs.length,fn:()=>this.clearDay(dk)},

  async addManual(dk){const tag=Store.data.ui.activeTag;if(!tag){Toast.error('تگ فعال انتخاب کن');return}const v=await Modal.prompt('افزودن به '+dk,'H:MM','',{placeholder:'1:30'});if(!v)return;try{const m=Fmt.parseMins(v);const ex=Store.data.calendar[dk]||[];const f=ex.find(e=>e.tag===tag);if(f)f.minutes+=m;else ex.push({tag:tag,minutes:m});Store.data.calendar[dk]=ex;Store.invalidateCalIndex();await Store.saveNow();this.render();UI.updateGlobalStats();Toast.success('اضافه شد')}catch(e){Toast.error('فرمت اشتباه')}},

/* ═══════ STATS PAGE WITH COMPARISON ═══════ */
Pages.Stats={
  init(){
    const sel=document.getElementById('stats-year');if(!sel)return;
    for(let y=YEAR_MIN;y<=YEAR_MAX;y++){const o=document.createElement('option');o.value=y;o.textContent=y;sel.appendChild(o)}
    sel.value=YEAR_DEFAULT;sel.onchange=()=>this.render();
    document.querySelectorAll('[data-stats-view]').forEach(b=>b.onclick=()=>{Store.data.ui.statsView=b.dataset.statsView;Store.save();this.render()});
  },
  render(){
    const view=Store.data.ui.statsView||'compare';
    document.querySelectorAll('[data-stats-view]').forEach(b=>b.classList.toggle('active',b.dataset.statsView===view));
    ['compare','metrics','monthly','weekly','yearly'].forEach(v=>{const el=document.getElementById('stats-view-'+v);if(el)el.style.display=(v===view?'block':'none')});
    const sel=document.getElementById('stats-year');
    const year=sel?+sel.value:YEAR_DEFAULT;
    if(view==='compare')this.renderCompare(year);
    if(view==='metrics')this.renderMetrics(year);
    if(view==='monthly')this.renderMonthly(year);
    if(view==='weekly')this.renderWeekly();
    if(view==='yearly')this.renderHeatmap(year);
  },
  renderCompare(year){
    const el=document.getElementById('stats-view-compare');if(!el)return;
    const mode=Store.data.ui.compareMode||'month';
    const modes=[{v:'day',l:'📅 روز قبل vs امروز'},{v:'week',l:'📆 هفته قبل vs این هفته'},{v:'month',l:'🗓 ماه قبل vs این ماه'},{v:'year',l:'📊 سال قبل vs امسال'}];
    const tabsHTML=modes.map(m=>'<button class="btn '+(mode===m.v?'btn-primary':'btn-ghost')+' btn-sm" data-cmp="'+m.v+'">'+m.l+'</button>').join('');
    el.innerHTML='<div class="compare-wrap"><div class="compare-tabs">'+tabsHTML+'</div><div id="cmp-canvas-wrap"><canvas id="cmp-chart"></canvas></div><div class="compare-legend" id="cmp-legend"></div><div class="compare-summary" id="cmp-summary"></div></div>';
    el.querySelectorAll('[data-cmp]').forEach(b=>{
      b.onclick=()=>{Store.data.ui.compareMode=b.dataset.cmp;Store.save();this.renderCompare(year)};
    });
    // Build data
    const t=Cal.today();
    let series1,series2,labels,label1,label2,yLabel;
    if(mode==='day'){
      const today=Cal.today();
      const yesterday=Cal.addDays(today,-1);
      const dk1=Fmt.dateKey(yesterday.y,yesterday.m,yesterday.d);
      const dk2=Fmt.dateKey(today.y,today.m,today.d);
      series1=Store.daySecondsByHour(dk1).map(s=>s/3600);
      series2=Store.daySecondsByHour(dk2).map(s=>s/3600);
      labels=[];for(let h=0;h<24;h++)labels.push(h+':00');
      label1=Fmt.pDate(yesterday.y,yesterday.m,yesterday.d);
      label2=Fmt.pDate(today.y,today.m,today.d);
      yLabel='ساعت کار';
    }else if(mode==='week'){
      const thisWeek=[];for(let i=6;i>=0;i--)thisWeek.push(Cal.addDays(t,-i));
      const prevWeek=[];for(let i=13;i>=7;i--)prevWeek.push(Cal.addDays(t,-i));
      series1=prevWeek.map(p=>Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d))/3600);
      series2=thisWeek.map(p=>Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d))/3600);
      labels=thisWeek.map(p=>{const wd=(Cal.firstWeekday(p.y,p.m)+p.d-1)%7;return WEEKDAYS[wd]});
      label1='هفته قبل';
      label2='این هفته';
      yLabel='ساعت';
    }else if(mode==='month'){
      const thisMonth={y:t.y,m:t.m};
      let prevM=t.m-1,prevY=t.y;
      if(prevM<1){prevM=12;prevY--}
      const nDaysThis=Cal.daysInMonth(thisMonth.y,thisMonth.m);
      const nDaysPrev=Cal.daysInMonth(prevY,prevM);
      const maxDays=Math.max(nDaysThis,nDaysPrev);
      series1=[];series2=[];
      for(let d=1;d<=maxDays;d++){
        series1.push(d<=nDaysPrev?Store.daySeconds(Fmt.dateKey(prevY,prevM,d))/3600:0);
        series2.push(d<=nDaysThis?Store.daySeconds(Fmt.dateKey(thisMonth.y,thisMonth.m,d))/3600:0);
      }
      labels=[];for(let d=1;d<=maxDays;d++)labels.push(String(d));
      label1=MONTHS[prevM-1]+' '+prevY;
      label2=MONTHS[t.m-1]+' '+t.y;
      yLabel='ساعت';
    }else{
      const thisYear=t.y;const prevY=t.y-1;
      series1=[];series2=[];
      for(let m=1;m<=12;m++){
        series1.push(Store.monthSeconds(prevY,m)/3600);
        series2.push(Store.monthSeconds(thisYear,m)/3600);
      }
      labels=MONTHS.map(m=>m.slice(0,3));
      label1=String(prevY);
      label2=String(thisYear);
      yLabel='ساعت';
    }
    const sum1=series1.reduce((a,b)=>a+b,0);
    const sum2=series2.reduce((a,b)=>a+b,0);
    const diff=sum2-sum1;
    const diffPct=sum1>0?Math.round(diff/sum1*100):(sum2>0?100:0);
    const diffCls=diff>0?'up':diff<0?'down':'';
    const diffSign=diff>0?'+':'';
    const sumEl=document.getElementById('cmp-summary');
    if(sumEl)sumEl.innerHTML=
      '<div class="compare-card"><div class="compare-card-label">'+Fmt.esc(label1)+'</div><div class="compare-card-val">'+sum1.toFixed(2)+'h</div></div>'+
      '<div class="compare-card"><div class="compare-card-label">'+Fmt.esc(label2)+'</div><div class="compare-card-val" style="color:var(--brand)">'+sum2.toFixed(2)+'h</div></div>'+
      '<div class="compare-card"><div class="compare-card-label">تفاوت</div><div class="compare-card-val '+(diffCls==='up'?'good':diffCls==='down'?'warn':'')+'" style="color:'+(diff>0?'var(--success)':diff<0?'var(--brand)':'var(--t3)')+'">'+diffSign+diff.toFixed(2)+'h</div><div class="compare-card-diff '+diffCls+'">'+(diffPct>0?'+':'')+diffPct+'%</div></div>';
    // Draw
    setTimeout(()=>{
      const cv=document.getElementById('cmp-chart');
      if(!cv)return;
      const parentW=cv.parentElement.clientWidth-24;
      const W=parentW,H=320;
      cv.width=W;cv.height=H;
      cv.style.width=W+'px';cv.style.height=H+'px';
      const ctx=cv.getContext('2d');
      const PL=60,PR=20,PT=30,PB=48;
      const cW=W-PL-PR,cH=H-PT-PB;
      const maxVal=Math.max(...series1,...series2,0.1);
      const step=maxVal<=2?0.5:maxVal<=5?1:maxVal<=10?2:Math.ceil(maxVal/6);
      const yMax=Math.ceil(maxVal/step)*step;
      const yPx=v=>PT+cH-(v/yMax)*cH;
      const t3='#71717a';
      const t0='#fafafa';
      // Grid
      ctx.font='11px JetBrains Mono, monospace';
      for(let tick=0;tick<=yMax+1e-9;tick+=step){
        const y=yPx(tick);
        ctx.strokeStyle='rgba(255,255,255,.06)';
        ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle=t3;ctx.textAlign='right';ctx.textBaseline='middle';
        ctx.fillText(tick.toFixed(1)+'h',PL-6,y);
      }
      // Axes
      ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(PL,PT);ctx.lineTo(PL,PT+cH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(PL,PT+cH);ctx.lineTo(W-PR,PT+cH);ctx.stroke();
      // Y label
      ctx.save();ctx.translate(14,PT+cH/2);ctx.rotate(-Math.PI/2);
      ctx.fillStyle=t3;ctx.font='11px Vazirmatn, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(yLabel,0,0);ctx.restore();
      // Draw a line + fill
      const drawLine=(vals,color,fillAlpha)=>{
        if(!vals.length)return;
        const n=vals.length;
        const xStep=cW/(n-1||1);
        // fill
        ctx.beginPath();
        ctx.moveTo(PL,yPx(0));
        vals.forEach((v,i)=>{ctx.lineTo(PL+i*xStep,yPx(v))});
        ctx.lineTo(PL+(n-1)*xStep,yPx(0));
        ctx.closePath();
        ctx.fillStyle=color.replace('#','rgba(').length===0?color:hexToRgba(color,fillAlpha);
        ctx.fill();
        // line
        ctx.beginPath();
        vals.forEach((v,i)=>{
          const x=PL+i*xStep,y=yPx(v);
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        });
        ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();
        // dots
        vals.forEach((v,i)=>{
          const x=PL+i*xStep,y=yPx(v);
          if(n>30&&i%3!==0&&i!==n-1)return;
          ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
          ctx.fillStyle=color;ctx.fill();
          ctx.strokeStyle='#101012';ctx.lineWidth=1.5;ctx.stroke();
        });
      };
      const hexToRgba=(hex,a)=>{
        const h=hex.replace('#','');
        const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
        return 'rgba('+r+','+g+','+b+','+a+')';
      };
      // Series 1 (previous) - blue
      drawLine(series1,'#3b82f6',0.12);
      // Series 2 (current) - brand pink
      drawLine(series2,'#ff3d5e',0.18);
      // X labels
      ctx.fillStyle=t3;ctx.font='10px Vazirmatn, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      const n=labels.length;
      const xStep=cW/(n-1||1);
      const step2=Math.max(1,Math.ceil(n/12));
      labels.forEach((lb,i)=>{
        if(i%step2!==0&&i!==n-1)return;
        const x=PL+i*xStep;
        ctx.fillText(lb,x,PT+cH+8);
      });
      // Legend
      const leg=document.getElementById('cmp-legend');
      if(leg)leg.innerHTML=
        '<div class="compare-legend-item"><div class="compare-legend-swatch" style="background:#3b82f6"></div>'+Fmt.esc(label1)+'</div>'+
        '<div class="compare-legend-item"><div class="compare-legend-swatch" style="background:#ff3d5e"></div>'+Fmt.esc(label2)+'</div>';
    },40);
  },
  renderMetrics(year){
    const dk2tags={};
    Store.data.sessions.forEach(s=>s.logs.forEach(l=>{
      if(!l.ts)return;

      const dk=Fmt.dateKey(p.y,p.m,p.d);
      if(!dk2tags[dk])dk2tags[dk]=[];

    }));
    const switchCounts=[];
    Object.values(dk2tags).forEach(arr=>{arr.sort((a,b)=>a.ts.localeCompare(b.ts));let c=0;for(let i=1;i<arr.length;i++)if(arr[i].tag!==arr[i-1].tag)c++;switchCounts.push(c)});
    const avgSwitch=switchCounts.length?Math.round(switchCounts.reduce((a,b)=>a+b,0)/switchCounts.length):0;
    const allLogs=Store.allLogs().filter(l=>{if(!l.ts)return false;const d=new Date(l.ts);return Cal.fromGregorian(d.getFullYear(),d.getMonth()+1,d.getDate()).y===year});
    const deepMins=allLogs.filter(l=>(l.seconds||l.minutes*60)>=25*60).reduce((a,l)=>a+(l.seconds||l.minutes*60),0)/60;
    const totalMins=allLogs.reduce((a,l)=>a+(l.seconds||l.minutes*60),0)/60;
    const deepRatio=totalMins?Math.round(deepMins/totalMins*100):0;
    const hourTotals={};
    allLogs.forEach(l=>{if(!l.ts)return;const h=new Date(l.ts).getHours();hourTotals[h]=(hourTotals[h]||0)+(l.seconds||l.minutes*60)});
    const bestHour=Object.entries(hourTotals).sort((a,b)=>b[1]-a[1])[0];

      '<div class="metric-card"><div class="metric-label">Deep Work</div><div class="metric-value '+(deepRatio>=50?'good':deepRatio>=25?'accent':'warn')+'">'+deepRatio+'%</div><div class="metric-sub">'+deepMins.toFixed(1)+'h از '+totalMins.toFixed(1)+'h</div></div>'+
      '<div class="metric-card"><div class="metric-label">ساعت اوج</div><div class="metric-value accent">'+bestHourStr+'</div><div class="metric-sub">'+(bestHour?(bestHour[1]/3600).toFixed(1)+'h کار':'—')+'</div></div>'+
      '<div class="metric-card"><div class="metric-label">جمع سال</div><div class="metric-value accent">'+(Store.yearSeconds(year)/3600).toFixed(1)+'h</div><div class="metric-sub">'+Object.keys(Store.data.calendar).filter(k=>Fmt.parseDateKey(k).y===year).length+' روز فعال</div></div>'+
      '<div class="metric-card"><div class="metric-label">Streak</div><div class="metric-value accent">'+Store.streak()+' روز</div><div class="metric-sub">'+Store.freezesRemaining()+' freeze</div></div>'+
    '</div>';
  },
  renderMonthly(year){
    const active=new Set();
    Object.keys(Store.data.calendar).forEach(dk=>{const p=dk.split('/');if(+p[0]===year)active.add(+p[1])});
    const list=document.getElementById('stats-list');const sum=document.getElementById('stats-summary');
    if(!list||!sum)return;list.innerHTML='';
    if(!active.size){sum.textContent='';list.innerHTML='<div class="empty" style="padding:60px 20px"><div class="empty-icon">📊</div><div class="empty-title">داده‌ای نیست</div></div>';return}
    [...active].sort((a,b)=>a-b).forEach(m=>{
      const sec=Store.monthSeconds(year,m);
      const card=document.createElement('div');card.className='trash-card';
      card.innerHTML='<div class="trash-info"><div class="trash-name" style="font-size:14px">'+MONTHS[m-1]+'</div><div class="trash-meta">'+(sec/3600).toFixed(2)+'h</div></div><button class="btn btn-ghost btn-sm" data-cal>📅 تقویم</button>';
      card.querySelector('[data-cal]').onclick=()=>{Store.data.ui.calY=year;Store.data.ui.calM=m;Store.save();Router.go('calendar')};

  },
  renderWeekly(){
    const t=Cal.today();
    const thisWeek=[];for(let i=6;i>=0;i--)thisWeek.push(Cal.addDays(t,-i));
    const prevWeek=[];for(let i=13;i>=7;i--)prevWeek.push(Cal.addDays(t,-i));
    const ts=thisWeek.reduce((a,p)=>a+Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d)),0);
    const ps=prevWeek.reduce((a,p)=>a+Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d)),0);
    const diff=ts-ps;
    const diffPct=ps?Math.round(diff/ps*100):(ts>0?100:0);
    const act=thisWeek.filter(p=>Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d))>0).length;
    const el=document.getElementById('stats-view-weekly');if(!el)return;

      '<div style="text-align:center"><div style="font-size:11px;color:var(--t3);margin-bottom:6px">این هفته</div><div style="font-family:var(--fm);font-size:22px;font-weight:800;color:var(--brand)">'+(ts/3600).toFixed(1)+'h</div></div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;padding:14px 18px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);gap:16px;flex-wrap:wrap">'+
      '<div><div style="font-size:10px;color:var(--t3)">روزهای فعال</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+act+'/7</div></div>'+
      '<div><div style="font-size:10px;color:var(--t3)">میانگین</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+((act?ts/act:0)/3600).toFixed(2)+'h</div></div>'+
      '<div><div style="font-size:10px;color:var(--t3)">هدف روزانه</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+(Store.data.settings.defaultGoalHours||4)+'h</div></div>'+
    '</div>';
  },
  renderHeatmap(year){
    const startJd=Cal.toJD(year,1,1);
    const endJd=Cal.toJD(year,12,Cal.daysInMonth(year,12));
    const totalDays=endJd-startJd+1;
    const offset=Cal.firstWeekday(year,1);
    const cells=[];
    for(let i=0;i<offset;i++)cells.push(null);
    for(let d=0;d<totalDays;d++){const p=Cal.fromJD(startJd+d);const dk=Fmt.dateKey(p.y,p.m,p.d);cells.push({dk:dk,p:p,mins:Store.dayMinutes(dk),frozen:!!Store.data.streakFreezeUsed[dk]})}
    while(cells.length%7)cells.push(null);
    const wc=cells.length/7;
    const allM=cells.filter(c=>c&&c.mins>0).map(c=>c.mins);
    const maxM=allM.length?Math.max(...allM):1;
    const lvl=m=>{if(!m)return 0;const p=m/maxM;if(p<0.25)return 1;if(p<0.5)return 2;if(p<0.75)return 3;return 4};
    let html='<div style="overflow-x:auto;padding:8px 0"><div style="display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;padding-right:24px">';
    for(let dow=0;dow<7;dow++)for(let w=0;w<wc;w++){
      const c=cells[w*7+dow];
      if(!c)html+='<div style="width:11px;height:11px;border-radius:2px;background:transparent"></div>';
      else{
        const extra=c.frozen?'outline:1px solid var(--info)':'';
        html+='<div style="width:11px;height:11px;border-radius:2px;background:var(--h'+lvl(c.mins)+');cursor:pointer;'+extra+'" data-dk="'+c.dk+'" title="'+Fmt.pDate(c.p.y,c.p.m,c.p.d)+' — '+(c.mins>0?Fmt.hm(c.mins):'—')+'"></div>';
      }
    }
    html+='</div><div style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t3);justify-content:flex-end;margin-top:12px"><span>کم</span>';
    for(let i=0;i<5;i++)html+='<div style="width:11px;height:11px;border-radius:2px;background:var(--h'+i+')"></div>';
    html+='<span>زیاد</span></div></div>';
    const tot=Store.yearSeconds(year);
    const act=allM.length;
    html='<div style="display:flex;justify-content:space-between;padding:14px 18px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);margin-bottom:16px;gap:16px;flex-wrap:wrap">'+
      '<div><div style="font-size:10px;color:var(--t3)">جمع</div><div style="font-family:var(--fm);font-size:17px;font-weight:700;color:var(--brand)">'+(tot/3600).toFixed(1)+'h</div></div>'+
      '<div><div style="font-size:10px;color:var(--t3)">فعال</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+act+'/'+totalDays+'</div></div>'+
      '<div><div style="font-size:10px;color:var(--t3)">میانگین</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+((tot/totalDays)/3600).toFixed(2)+'h</div></div>'+
    '</div>'+html;
    const c=document.getElementById('stats-view-yearly');if(!c)return;
    c.innerHTML=html;
    c.querySelectorAll('[data-dk]').forEach(cell=>{cell.onclick=()=>{const dk=cell.dataset.dk;if(Store.data.calendar[dk])Pages.Calendar.dayDetail(dk)}});
  }
};

  restore(){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text();const data=JSON.parse(text);if(!data||typeof data!=='object'||!('sessions'in data||'_meta'in data)){Toast.error('فایل معتبر نیست');return}if(data._meta&&data._meta.checksum){const copy=Object.assign({},data);delete copy._meta;const re=await Sha.hash(JSON.stringify(canonicalize(copy)));if(re!==data._meta.checksum){const ok=await Modal.confirm('checksum نامطابق','ادامه؟',{danger:true,confirmText:'ادامه'});if(!ok)return}}const ok=await Modal.confirm('بارگذاری','جایگزین بشه؟',{danger:true,confirmText:'بارگذاری'});if(!ok)return;const clean=Object.assign({},data);delete clean._meta;Store.data=Store._validate(clean);Store._calDirty=true;await Store.saveNow();location.reload()}catch(err){console.error(err);Toast.error('خطا')}};input.click()},
