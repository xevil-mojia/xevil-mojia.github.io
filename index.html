  renderHeatmap(year){
    const startJd=Cal.toJD(year,1,1);
    const endJd=Cal.toJD(year,12,Cal.daysInMonth(year,12));
    const totalDays=endJd-startJd+1;
    const offset=Cal.firstWeekday(year,1);
    const cells=[];
    for(let i=0;i<offset;i++)cells.push(null);
    for(let d=0;d<totalDays;d++){const p=Cal.fromJD(startJd+d);const dk=Fmt.dateKey(p.y,p.m,p.d);cells.push({dk:dk,p:p,mins:Store.dayMinutes(dk),frozen:!!Store.data.streakFreezeUsed[dk]})}
    while(cells.length%7)cells.push(null);
    const wc=cells.length/7;
    const allM=cells.filter(c=>c&&c.mins>0).map(c=>c.mins);
    const maxM=allM.length?Math.max(...allM):1;
    const lvl=m=>{if(!m)return 0;const p=m/maxM;if(p<0.25)return 1;if(p<0.5)return 2;if(p<0.75)return 3;return 4};
    let html='<div style="overflow-x:auto;padding:8px 0"><div style="display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;padding-right:24px">';
    for(let dow=0;dow<7;dow++)for(let w=0;w<wc;w++){
      const c=cells[w*7+dow];
      if(!c)html+='<div style="width:11px;height:11px;border-radius:2px;background:transparent"></div>';
      else{
        const extra=c.frozen?'outline:1px solid var(--info)':'';
        html+='<div style="width:11px;height:11px;border-radius:2px;background:var(--h'+lvl(c.mins)+');cursor:pointer;'+extra+'" data-dk="'+c.dk+'" title="'+Fmt.pDate(c.p.y,c.p.m,c.p.d)+' — '+(c.mins>0?Fmt.hm(c.mins):'—')+'"></div>';
      }
    }
    html+='</div><div style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t3);justify-content:flex-end;margin-top:12px"><span>کم</span>';
    for(let i=0;i<5;i++)html+='<div style="width:11px;height:11px;border-radius:2px;background:var(--h'+i+')"></div>';
    html+='<span>زیاد</span></div></div>';
    const tot=Store.yearSeconds(year);
    const act=allM.length;
    html='<div style="display:flex;justify-content:space-between;padding:14px 18px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r14);margin-bottom:16px;gap:16px;flex-wrap:wrap">'+
      '<div><div style="font-size:10px;color:var(--t3)">جمع</div><div style="font-family:var(--fm);font-size:17px;font-weight:700;color:var(--brand)">'+(tot/3600).toFixed(1)+'h</div></div>'+
      '<div><div style="font-size:10px;color:var(--t3)">فعال</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+act+'/'+totalDays+'</div></div>'+
      '<div><div style="font-size:10px;color:var(--t3)">میانگین</div><div style="font-family:var(--fm);font-size:17px;font-weight:700">'+((tot/totalDays)/3600).toFixed(2)+'h</div></div>'+
    '</div>'+html;
    const c=document.getElementById('stats-view-yearly');if(!c)return;
    c.innerHTML=html;
    c.querySelectorAll('[data-dk]').forEach(cell=>{cell.onclick=()=>{const dk=cell.dataset.dk;if(Store.data.calendar[dk])Pages.Calendar.dayDetail(dk)}});
  }
};

/* ═══════ COMPARE CHART GEOMETRY (2r) ═══════
   The compare chart used to be drawn at a fixed 320px height, 11px labels and a 1x backing
   store, which is illegible and blurry on a phone. One object now decides size, stroke and
   typography so the numbers can be asserted without a canvas:
     - phones: 280px tall, 12px labels, never below the 320px minimum width
     - tablets: 300px / 13px    - desktop: 340px / 14px
     - stroke: Math.max(2, Math.round(width/200)) — thicker on wide canvases, never <2
     - dense series widen the canvas (the wrapper scrolls) instead of being squeezed
     - the backing store is scaled by devicePixelRatio and the CSS size stays in CSS px */
/* 2s/R4: one place the app asks "how wide are we?". A test runner can set
   window.__MoJiaTestViewport={width,height} to exercise the responsive branches in any
   environment (a headless run has no real viewport); removing it restores the real one. */
const Viewport={
  override(){try{const o=window.__MoJiaTestViewport;return (o&&o.width)?o:null}catch(e){return null}},
  w(){const o=this.override();if(o)return o.width;try{return window.innerWidth||1024}catch(e){return 1024}},
  // R1b: the single source of truth for 'this device is touch-first'. Width is only a
  // fallback — on real Android Chrome window.innerWidth can report >1024 (desktop mode,
  // pinch zoom) while the device is unmistakably a phone.
  touch(){try{return (navigator.maxTouchPoints||0)>0||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)||this.w()<=1024}catch(e){return true}},   // same rule as PiP.touchFirst
  h(){const o=this.override();if(o)return o.height;try{return window.innerHeight||768}catch(e){return 768}},
  isPhone(){return this.w()<=480},
  isTablet(){return this.w()>480&&this.w()<=1024},
  isMobileChrome(){return this.w()<=820}
};
const Chart={minW:320,denseStep:26,
  plan(vw){
    vw=vw||Viewport.w();
    const phone=vw<=480,tablet=vw<=1024;
    let dpr=1;try{dpr=window.devicePixelRatio||1}catch(e){}
    return {vw:vw,h:phone?280:(tablet?300:340),font:phone?12:(tablet?13:14),minW:this.minW,dpr:dpr};
  },
  size(wrapW,points,vw){
    const p=this.plan(vw);
    const avail=Math.max(p.minW,Math.round(wrapW||0));
    const dense=Math.round((points||0)*this.denseStep+90);
    const cssW=Math.max(avail,dense);
    return {cssW:cssW,cssH:p.h,font:p.font,lineW:Math.max(2,Math.round(cssW/200)),dpr:p.dpr,scrolls:cssW>avail};
  },
  forCanvas(cv,points){
    const wrapW=(cv&&cv.parentElement)?(cv.parentElement.clientWidth-24):0;
    return this.size(wrapW,points);
  }};

const Palette={
  _open:false,_i:0,_items:[],_gk:null,
  open(){if(this._open)return;this._open=true;const ov=document.createElement('div');ov.className='palette-overlay';ov.innerHTML='<div class="palette"><div class="palette-input-wrap"><span class="palette-icon">⌘</span><input class="palette-input" id="palette-input" placeholder="جستجو..." autocomplete="off"><kbd class="palette-kbd">ESC</kbd></div><div class="palette-results" id="palette-results"></div></div>';ov.onclick=()=>this.close();document.body.appendChild(ov);this._el=ov;const inp=ov.querySelector('#palette-input');inp.focus();inp.oninput=()=>this._upd(inp.value);inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();this._move(1)}else if(e.key==='ArrowUp'){e.preventDefault();this._move(-1)}else if(e.key==='Enter'){e.preventDefault();this._run()}else if(e.key==='Escape'){e.preventDefault();this.close()}};this._gk=e=>{if(e.key==='Escape')this.close()};document.addEventListener('keydown',this._gk);this._upd('')},
  close(){if(!this._open)return;this._open=false;if(this._el)this._el.remove();this._el=null;if(this._gk)document.removeEventListener('keydown',this._gk)},
  _move(d){const l=this._items.length;if(!l)return;this._i=(this._i+d+l)%l;this._selUpdate()},
  _selUpdate(){const r=this._el?this._el.querySelector('#palette-results'):null;if(!r)return;r.querySelectorAll('.palette-item').forEach((el,i)=>el.classList.toggle('selected',i===this._i));const s=r.querySelector('.palette-item.selected');if(s)s.scrollIntoView({block:'nearest'})},
  _upd(q){this._items=this._build(q);this._i=0;this._render()},
  _build(q){q=q.trim().toLowerCase();const recent=Store.data.recentPalette||[];const actions=[{icon:'⏱',title:'شروع/مکث',sub:'Space',key:'start',fn:()=>{if(Store.data.timer.running)Timer.pause();else Timer.start()}},{icon:'⚡',title:'Quick-Start',sub:'Q',key:'qs',fn:()=>Pages.Timer.quickStart()},{icon:'⏹',title:'توقف',key:'stop',fn:()=>Timer.stop()},{icon:'➕',title:'سشن جدید',key:'ns',fn:()=>Pages.Timer.newSession()},{icon:'🏷',title:'تگ جدید',key:'nt',fn:()=>Pages.Timer.newTag()},{icon:'📝',title:'لاگ دستی',key:'ml',fn:()=>Pages.Timer.manualLog()},{icon:'🎯',title:'Focus Mode',sub:'F',key:'fm',fn:()=>UI.toggleFocus()},{icon:'💾',title:'بک‌آپ',sub:'Ctrl+S',key:'bk',fn:()=>App.backup()},{icon:'📊',title:'CSV',key:'csv',fn:()=>Pages.Logs.exportCSV()},{icon:'⌨',title:'راهنما',sub:'?',key:'h',fn:()=>Help.show()},{icon:'🌗',title:'تم',key:'th',fn:()=>UI.toggleTheme()},{icon:'⚙',title:'تنظیمات',key:'st',fn:()=>Router.go('settings')},{icon:'1',title:'تایمر',key:'g1',fn:()=>Router.go('timer')},{icon:'2',title:'Timeline',key:'g2',fn:()=>Router.go('timeline')},{icon:'3',title:'لاگ‌ها',key:'g3',fn:()=>Router.go('logs')},{icon:'4',title:'تقویم',key:'g4',fn:()=>Router.go('calendar')},{icon:'5',title:'ژورنال',key:'g5',fn:()=>Router.go('journal')},{icon:'6',title:'اهداف',key:'g6',fn:()=>Router.go('goals')},{icon:'7',title:'آمار',key:'g7',fn:()=>Router.go('stats')}];const sessions=Store.data.sessions.map(s=>({icon:'📁',title:'سشن: '+s.name,sub:s.logs.length+' لاگ',key:'s'+s.id,fn:()=>{Router.go('timer');Pages.Timer.openSession(s.id)}}));const tags=Store.data.tags.map(t=>({icon:'🏷',title:'تگ: '+t,key:'t'+t,fn:()=>{Store.data.ui.activeTag=t;Store.save();Router.go('timer');Pages.Timer.renderTags()}}));const all=actions.concat(sessions,tags);if(!q){const rec=recent.map(k=>all.find(a=>a.key===k)).filter(Boolean);const oth=all.filter(a=>!recent.includes(a.key));return rec.slice(0,6).concat(oth.slice(0,10))}return all.filter(it=>it.title.toLowerCase().includes(q)||(it.sub||'').toLowerCase().includes(q)).slice(0,16)},
  _render(){const r=this._el?this._el.querySelector('#palette-results'):null;if(!r)return;if(!this._items.length){r.innerHTML='<div class="palette-empty">پیدا نشد</div>';return}r.innerHTML=this._items.map((it,i)=>'<div class="palette-item '+(i===this._i?'selected':'')+'" data-i="'+i+'"><div class="palette-item-icon">'+it.icon+'</div><div class="palette-item-text"><div class="palette-item-title">'+Fmt.esc(it.title)+'</div>'+(it.sub?'<div class="palette-item-sub">'+Fmt.esc(it.sub)+'</div>':'')+'</div></div>').join('');const self=this;r.querySelectorAll('.palette-item').forEach(el=>{el.onclick=()=>{self._i=+el.dataset.i;self._run()};el.onmouseenter=()=>{self._i=+el.dataset.i;r.querySelectorAll('.palette-item').forEach((x,j)=>x.classList.toggle('selected',j===self._i))}})},
  _run(){const it=this._items[this._i];if(!it)return;const rec=Store.data.recentPalette=Store.data.recentPalette||[];const i=rec.indexOf(it.key);if(i>=0)rec.splice(i,1);rec.unshift(it.key);if(rec.length>10)rec.length=10;Store.save();this.close();setTimeout(()=>{try{it.fn()}catch(e){console.error(e)}},50)}

    if(sv){Store.data.ui.statsView=sv.dataset.statsView;Store.save();Pages.Stats.render();return}
  });
  const ss=document.getElementById('sess-search');
  if(ss)ss.addEventListener('input',e=>{clearTimeout(Pages.Timer._searchTimer);Pages.Timer._searchTimer=setTimeout(()=>{Pages.Timer._search=e.target.value;Pages.Timer.renderSessions()},150)});
  const bt=document.getElementById('bulk-toggle');
  if(bt)bt.onclick=()=>{Store.data.ui.bulkMode=!Store.data.ui.bulkMode;Store.save();bt.classList.toggle('active',Store.data.ui.bulkMode);Pages.Timer._selectedIds.clear();Pages.Timer.renderSessions();Pages.Timer.renderBulkBar()};
  ['lf-search','lf-tag','lf-session','lf-type'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const ev=id==='lf-search'?'input':'change';el.addEventListener(ev,()=>{if(id==='lf-search'){clearTimeout(Pages.Logs._t);Pages.Logs._t=setTimeout(()=>Pages.Logs._applyFilters(),150)}else Pages.Logs._applyFilters()})});
  const ts=document.getElementById('topbar-search');
  if(ts){ts.onclick=()=>Palette.open();ts.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();Palette.open()}}}
  const themeBtn=document.getElementById('theme-toggle');
  if(themeBtn)themeBtn.onclick=()=>{UI.toggleTheme();if(Store.data.ui.page==='settings')Pages.Settings.render()};
  const focusBtn=document.getElementById('focus-btn');
  if(focusBtn)focusBtn.onclick=()=>{UI.toggleFocus();if(Store.data.ui.page==='settings')Pages.Settings.render()};
  document.addEventListener('keydown',e=>{
    const t=e.target;const typing=t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Palette.open();return}
    if(e.key==='Escape'){if(Palette._open){Palette.close();return}if(Modal._stack.length){Modal._stack[Modal._stack.length-1]();return}if(Store.data.settings.focusMode){UI.toggleFocus();return}return}
    if(typing)return;
    if(Modal._stack.length||Palette._open)return;
    if(e.key==='?'||(e.shiftKey&&e.key==='/')){e.preventDefault();Help.show();return}
    if(e.code==='Space'){e.preventDefault();if(Store.data.timer.running)Timer.pause();else Timer.start();return}
    if(e.key==='q'||e.key==='Q'){e.preventDefault();Pages.Timer.quickStart();return}
    if(e.key==='f'||e.key==='F'){e.preventDefault();UI.toggleFocus();return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();App.backup();return}
    if(!e.ctrlKey&&!e.altKey&&!e.metaKey){const m={'1':'timer','2':'timeline','3':'logs','4':'calendar','5':'journal','6':'goals','7':'stats'};if(m[e.key])Router.go(m[e.key])}
  });
  window.addEventListener('beforeunload',e=>{if(Store.data.timer.running){Store.data.timer.elapsed=Timer.elapsed();Store.data.timer.startedAt=Date.now();try{localStorage.setItem(STORE_KEY,JSON.stringify(Store.data))}catch(err){}const secs=Timer.elapsed();if(secs>60){e.preventDefault();e.returnValue='تایمر در حال اجراست';return e.returnValue}}});
  Bus.on('timer-start',()=>{UI.updateControls();TitleBar.update()});
  Bus.on('timer-pause',()=>{UI.updateControls();TitleBar.update()});
  Bus.on('timer-stop',()=>{UI.updateControls();UI.updateGlobalStats();TitleBar.update()});
  Bus.on('save',()=>UI.showSaveIndicator('saving'));
  Bus.on('saved',()=>UI.showSaveIndicator('saved'));
}

/* ── host capabilities + storage probe (2h) ──
   Every optional browser API the app touches is detected once, so a missing one
   degrades a feature instead of throwing somewhere unpredictable. */
const Env={touch(){try{return (navigator.maxTouchPoints||0)>0||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)||window.innerWidth<=1024}catch(e){return true}},idb:false,clipboard:false,notifications:false,audio:false,pip:false,subtle:false,
  detect(){
    try{this.idb=!!(typeof indexedDB!=='undefined'&&indexedDB&&indexedDB.open)}catch(e){this.idb=false}
    try{this.clipboard=!!(navigator&&navigator.clipboard&&navigator.clipboard.writeText)}catch(e){this.clipboard=false}
    try{this.notifications=('Notification'in window)}catch(e){this.notifications=false}
    try{this.audio=!!(window.AudioContext||window.webkitAudioContext)}catch(e){this.audio=false}
    try{this.pip=!!(document.pictureInPictureEnabled)}catch(e){this.pip=false}
    try{this.subtle=!!(crypto&&crypto.subtle)}catch(e){this.subtle=false}
    return this.report();
  },
  report(){return {indexedDB:this.idb,clipboard:this.clipboard,notifications:this.notifications,audio:this.audio,pip:this.pip,cryptoSubtle:this.subtle,secureContext:(function(){try{return !!window.isSecureContext}catch(e){return false}})()}}};
const Storage={ok:null,
  writeTest(){try{const k='__mj_probe';localStorage.setItem(k,'1');const v=localStorage.getItem(k)==='1';localStorage.removeItem(k);return v}catch(e){return false}},
  probe(){
    const ls=this.writeTest();
    let idb=false;try{idb=!!('indexedDB'in window)}catch(e){idb=false}
    this.ok=ls||idb;
    Store.ephemeral=!this.ok;
    if(!this.ok)ErrorLog.capture({kind:'error',msg:'حافظهٔ مرورگر در دسترس نیست (localStorage و IndexedDB هر دو بسته‌اند) — داده‌ها فقط تا بستن این تب می‌مانند',src:'storage:degraded'});
    else if(!ls)ErrorLog.capture({kind:'error',msg:'localStorage بسته است — ذخیره‌سازی فقط با IndexedDB انجام می‌شود',src:'storage:fallback'});
    return this.ok;
  }};
/* ── scheduled jobs (2h) ──
   These start at parse time, which is BEFORE `await Store.load()` resolves, so Store.data
   is legitimately null for the first moments. Unguarded reads threw
   "Cannot read properties of null (reading 'timer')" once a second on any device where
   loading took longer than a second — on mobile it covered the UI with an error banner.
   Each job is now null-guarded, cannot let a throw escape its callback, and logs a given
   failure once instead of once per tick. */
let lastDate=Fmt.dateKey(Cal.today().y,Cal.today().m,Cal.today().d);
const Ticks={
  autosave(){if(!Store.data)return;const t=Store.data.timer;if(t.running){t.elapsed=Timer.elapsed();t.startedAt=Date.now();Store.save()}},
  titlebar(){if(!Store.data)return;if(Store.data.timer.running)TitleBar.update()},
  atRisk(){if(!Store.data)return;UI.updateAtRisk()},
  recurring(){if(!Store.data)return;Pages.Goals.syncRecurring()},
  rollover(){if(!Store.data)return;const today=Cal.today();const todayDk=Fmt.dateKey(today.y,today.m,today.d);if(todayDk!==lastDate){lastDate=todayDk;Pages.Goals.syncRecurring();UI.updateGlobalStats()}}
};
const tickGuard=(label,fn)=>{let lastFail=null;return()=>{try{fn();lastFail=null}catch(e){const k=String((e&&e.message)||e);if(k!==lastFail){lastFail=k;ErrorLog.capture({kind:'error',msg:'job «'+label+'» شکست خورد: '+k,stack:(e&&e.stack)||null,src:'interval:'+label})}}}};
const safeTick=(label,ms)=>setInterval(tickGuard(label,Ticks[label]),ms);
safeTick('autosave',30000);
safeTick('titlebar',1000);
safeTick('atRisk',60000);
safeTick('recurring',5*60*1000);
safeTick('rollover',60000);

/* ═══════ BOOT (2h) — one failing step must never leave a dead page ═══════
   It used to be a single try block: the first throw aborted everything and the app
   stayed blank behind an error banner. Now every step is isolated (logged + skipped),
   the public API is published before any risky work, and a failed store load still
   mounts the app in degraded (in-memory) mode. */
const Boot={
  failures:[],
  async step(name,fn){
    try{return await fn()}
    catch(e){
      this.failures.push(name);
      ErrorLog.capture({kind:'error',msg:'گام بوت «'+name+'» شکست خورد: '+((e&&e.message)||e),stack:(e&&e.stack)||null,src:'boot:'+name});
      return null;
    }
  },
  ensureStore(){
    if(Store.data)return Store.data;
    try{Store.data=Store._fresh();Store.invalidateEvents();Store.syncCalendar()}catch(e){try{Store.data=Store._fresh()}catch(e2){}}
    Store.ephemeral=true;
    return Store.data;
  },
  publishApi(){
    try{
      window.MoJiaTests=()=>Tests.run();
      window.MoJiaStore=Store;
      window.MoJia=Object.freeze({
        version:SCHEMA_VERSION,
        todayISO:()=>Store.todayISO(),
        todayMinutes:()=>Store.todayMinutes(),
        heatmapValueForDate:d=>Store.heatmapValueForDate(d),
        dayMinutes:dk=>Store.dayMinutes(dk),
        daySeconds:dk=>Store.daySeconds(dk),
        monthMinutes:(y,m)=>Store.monthMinutes(y,m),
        yearMinutes:y=>Store.yearMinutes(y),
        streak:()=>Store.streak(),
        variance:(est,actual)=>Store.variance(est,actual),
        varianceReport:y=>Store.varianceReport(y),
        tagSecondsInYear:(t,y)=>Store.tagSecondsInYear(t,y),
        events:()=>Store.data.events.slice(),
        calendar:()=>JSON.parse(JSON.stringify(Store.data.calendar)),
        syncCalendar:()=>Store.syncCalendar(),
        errors:()=>ErrorLog.all(),
        errorText:()=>ErrorLog.asText(),
        clearErrors:()=>ErrorLog.clear(),
        capabilities:()=>Env.report(),
        bootFailures:()=>Boot.failures.slice(),
        environment:()=>({secureContext:(function(){try{return !!window.isSecureContext}catch(e){return false}})(),persist:Storage.ok,ephemeral:Store.ephemeral,ua:navigator.userAgent}),
        runTests:()=>Tests.run(),
        testFailures:()=>window.__MoJiaTestFails||[],
        showTestFailures:()=>Tests.showFailures()
      });
    }catch(e){/* publishing must never be the thing that kills boot */}
  },
  async run(){
    this.publishApi();                                   // inspectable even if everything below fails
    await this.step('store.load',async()=>{await Store.load();ErrorLog.drain()});
    this.ensureStore();                                  // degraded mount instead of a blank page
    await this.step('env.detect',()=>Env.detect());
    await this.step('storage.probe',()=>Storage.probe());
    await this.step('cleanupTrash',()=>Store.cleanupTrash());
    await this.step('applyTheme',()=>UI.applyTheme());
    await this.step('fullscreenListener',()=>document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&Store.data&&Store.data.settings.focusMode){Store.data.settings.focusMode=false;Store.save();document.body.classList.remove('focus-mode');const btn=document.getElementById('focus-btn');if(btn)btn.classList.remove('active')}}));
    await this.step('idle.init',()=>Idle.init());
    await this.step('focusMode',()=>{if(Store.data.settings.focusMode)document.body.classList.add('focus-mode')});
    await this.step('snapCalDefault',()=>Store.snapCalDefault());
    await this.step('sessionDefaults',()=>{
      if(!Store.data.ui.activeSessionId&&Store.data.sessions.length)Store.data.ui.activeSessionId=Store.data.sessions[0].id;
      if(!Store.data.ui.activeTag&&Store.data.tags.length)Store.data.ui.activeTag=Store.data.tags[0];
      const tr=Store.data.timer;
      if(tr.sessionId&&!Store.data.sessions.find(s=>s.id===tr.sessionId)){tr.running=false;tr.startedAt=null;tr.elapsed=0;tr.sessionId=null;tr.tag=null}
    });
    await this.step('recurringGoals',()=>Pages.Goals.syncRecurring());
    await this.step('bindEvents',()=>bindEvents());
    await this.step('stats.init',()=>Pages.Stats.init());
    await this.step('globalStats',()=>UI.updateGlobalStats());
    await this.step('chromeState',()=>{
      const bt=document.getElementById('bulk-toggle');if(bt)bt.classList.toggle('active',Store.data.ui.bulkMode);
      const fb=document.getElementById('focus-btn');if(fb)fb.classList.toggle('active',Store.data.settings.focusMode);
    });
    await this.step('router',()=>Router.go((Store.data&&Store.data.ui.page)||'timer'));
    await this.step('timer.resume',()=>{
      const tr=Store.data.timer;
      if(tr.running&&tr.startedAt){const el=(Date.now()-tr.startedAt)/1000;tr.elapsed=(tr.elapsed||0)+Math.floor(el);tr.startedAt=Date.now();clearInterval(Timer._interval);Timer._interval=setInterval(()=>Timer._tick(),250);UI.updateControls();TitleBar.update()}
      else{UI.updateClock();UI.updateControls()}
    });
    await this.step('badge',()=>ErrorLog.badge());
    await this.step('chromeMetrics',()=>UI.syncChromeMetrics());
    this.publishApi();
    if(this.failures.length)ErrorLog.capture({kind:'error',msg:'بوت با '+this.failures.length+' گام ناموفق ادامه یافت: '+this.failures.join(', '),src:'boot:degraded'});
    return this.failures.length;
  }
};
async function boot(){
  try{await Boot.run()}
  catch(e){
    // last resort: never leave a blank page, whatever happens
    try{ErrorLog.capture({kind:'error',msg:'بوت کامل شکست خورد: '+((e&&e.message)||e),stack:(e&&e.stack)||null,src:'boot'})}catch(e2){}
    try{Boot.ensureStore()}catch(e2){}
    try{Router.go('timer')}catch(e2){}
    try{Boot.publishApi()}catch(e2){}
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
</body>
</html>
