<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>MoJia TimeTracker xPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>(function(){try{var s=JSON.parse(localStorage.getItem('mojia_tt_v10')||'{}');if(s.settings&&s.settings.theme)document.documentElement.dataset.theme=s.settings.theme}catch(e){}})();
/* Pre-boot error buffer (2f): the app's ErrorLog drains this at boot. There is no UI
   here on purpose — the banner is owned by ErrorLog alone, one reporting path. */
(function(){try{window.__bootErr=[];
var push=function(o){try{window.__bootErr.push(o)}catch(e){}};
window.addEventListener('error',function(e){push({ts:Date.now(),kind:'error',msg:e.message,src:e.filename,line:e.lineno,col:e.colno,stack:e.error&&e.error.stack?e.error.stack:null})});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;push({ts:Date.now(),kind:'rejection',msg:r&&r.message?r.message:String(r),reason:String(r),stack:r&&r.stack?r.stack:null})});
}catch(e){}})();
</script>
<style>
:root{--fs:'Vazirmatn',system-ui,sans-serif;--fm:'JetBrains Mono',monospace;--s0:#0a0a0b;--s1:#101012;--s2:#17171a;--s3:#1e1e22;--s4:#26262b;--s5:#32323a;--t0:#fafafa;--t1:#e4e4e7;--t2:#a1a1aa;--t3:#71717a;--t4:#52525b;--brand:#ff3d5e;--brand-hi:#e11d48;--brand-soft:rgba(255,61,94,.13);--brand-glow:rgba(255,61,94,.4);--brand-grad:linear-gradient(135deg,#ff3d5e 0%,#f97316 100%);--success:#10b981;--success-soft:rgba(16,185,129,.12);--warning:#f59e0b;--warning-soft:rgba(245,158,11,.12);--info:#3b82f6;--info-soft:rgba(59,130,246,.12);--purple:#a855f7;--bd:rgba(255,255,255,.06);--bd2:rgba(255,255,255,.1);--bd3:rgba(255,255,255,.16);--r6:6px;--r10:10px;--r14:14px;--r20:20px;--sw:236px;--th:60px;--h0:var(--s2);--h1:#4c1d24;--h2:#7f1d1d;--h3:#b91c1c;--h4:var(--brand)}
[data-theme="light"]{--s0:#fafafa;--s1:#fff;--s2:#f4f4f5;--s3:#e4e4e7;--s4:#d4d4d8;--s5:#a1a1aa;--t0:#09090b;--t1:#27272a;--t2:#52525b;--t3:#71717a;--t4:#a1a1aa;--bd:rgba(0,0,0,.06);--bd2:rgba(0,0,0,.1);--h0:#ebedf0;--h1:#ffd9dd;--h2:#ff9ba6;--h3:#ff5c72;--h4:var(--brand)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--s0);color:var(--t0);font-family:var(--fs);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.focus-mode .sidebar,body.focus-mode .topbar-search,body.focus-mode .topbar-stats .pill,body.focus-mode .sessions-panel,body.focus-mode .summary-bar{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
#error-banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#b91c1c;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;z-index:99999;display:none;max-width:90vw}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px;display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:var(--r14);background:var(--brand-grad);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;box-shadow:0 8px 32px var(--brand-glow)}
.brand-name{font-size:15px;font-weight:900;background:linear-gradient(135deg,var(--t0),var(--t2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:9px;letter-spacing:2.5px;font-family:var(--fm);font-weight:600;background:var(--brand-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-section{padding:0 12px;margin-top:12px}
.sb-label{font-size:10px;font-weight:700;color:var(--t4);letter-spacing:1.5px;text-transform:uppercase;padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r10);color:var(--t3);font-size:13px;font-weight:500;text-align:right;position:relative;width:100%;transition:all .15s}
.nav-item:hover{color:var(--t1);background:var(--s2)}
.nav-item.active{color:var(--t0);background:var(--brand-soft)}
.nav-item.active::before{content:'';position:absolute;right:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:var(--brand);box-shadow:0 0 12px var(--brand)}
.nav-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-right:auto;font-family:var(--fm);font-size:10px;background:var(--s3);color:var(--t3);padding:1px 7px;border-radius:999px;font-weight:600;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:var(--brand);color:#fff}
.sb-spacer{flex:1}
.sb-footer{padding:14px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.sb-stat{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--t3);padding:4px 0}
.sb-stat-val{font-family:var(--fm);font-weight:700;color:var(--t1)}
.sb-links{display:flex;gap:6px;margin-top:4px}
.sb-link{flex:1;padding:6px;border-radius:var(--r6);background:var(--s2);color:var(--t3);font-size:11px;font-weight:600;text-align:center;border:1px solid var(--bd);cursor:pointer}
.sb-link:hover{background:var(--s3);color:var(--brand)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--th);flex-shrink:0;border-bottom:1px solid var(--bd);background:var(--s1);display:flex;align-items:center;padding:0 20px;gap:14px}
.topbar-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.topbar-title-mark{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
.topbar-search{flex:1;max-width:420px;height:36px;margin:0 auto;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r10);padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--t3);font-size:12px;cursor:pointer}
.topbar-search:hover{border-color:var(--bd3);color:var(--t2)}
.topbar-search-text{flex:1;text-align:right}
.topbar-search-kbd{font-family:var(--fm);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--s3);border:1px solid var(--bd2)}
.topbar-stats{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--t2)}
.pill-icon{font-size:12px}
.pill-val{font-family:var(--fm);font-weight:700;color:var(--t0)}
.pill.accent{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.pill.accent .pill-val{color:var(--brand)}
.pill.warning{background:var(--warning-soft);border-color:var(--warning-soft);color:var(--warning)}
.save-indicator{font-size:10px;color:var(--t3);font-family:var(--fm);opacity:0;transition:opacity .4s;pointer-events:none}
.save-indicator.show{opacity:1}
.save-indicator.saved::before{content:'✓ ';color:var(--success)}
.icon-btn{width:36px;height:36px;border-radius:var(--r10);display:inline-flex;align-items:center;justify-content:center;color:var(--t3);font-size:15px}
.icon-btn:hover{background:var(--s2);color:var(--t0)}
.icon-btn.active{background:var(--brand-soft);color:var(--brand)}
.page{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.page.active{display:flex}
.page-inner{flex:1;overflow-y:auto;padding:20px 24px;min-height:0}
.page-header{padding:16px 24px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-header-title{font-size:16px;font-weight:800}
.page-header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r10);font-size:12px;font-weight:600;border:1px solid transparent;transition:all .15s;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-xs{padding:4px 9px;font-size:10px}.btn-sm{padding:6px 12px;font-size:11px}.btn-lg{padding:12px 22px;font-size:13px;border-radius:var(--r14)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px var(--brand-glow)}
.btn-primary:hover:not(:disabled){background:var(--brand-hi)}
.btn-ghost{background:var(--s2);color:var(--t1);border-color:var(--bd)}
.btn-ghost:hover:not(:disabled){background:var(--s3);color:var(--t0)}
.btn-success{background:var(--success-soft);color:var(--success);border-color:rgba(16,185,129,.3)}
.btn-danger{background:var(--brand-soft);color:var(--brand);border-color:rgba(255,61,94,.3)}
.btn-info{background:var(--info-soft);color:var(--info);border-color:rgba(59,130,246,.3)}
.btn-icon{width:30px;height:30px;border-radius:var(--r6);display:inline-flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px}
.btn-icon:hover{background:var(--s3);color:var(--t0)}
.btn-icon.danger:hover{background:var(--brand-soft);color:var(--brand)}
.btn-icon.active{background:var(--brand-soft);color:var(--brand)}
.timer-layout{display:flex;flex:1;overflow:hidden;min-height:0}
.sessions-panel{width:264px;flex-shrink:0;background:var(--s1);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sessions-header{padding:14px;border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}
.sessions-header-row{display:flex;align-items:center;justify-content:space-between}
.sessions-title{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sessions-count{font-family:var(--fm);font-size:10px;background:var(--s3);color:var(--t3);padding:1px 6px;border-radius:999px}
.search-wrap{position:relative}
.search-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:13px;pointer-events:none}
.search-input{width:100%;height:34px;padding:0 34px 0 12px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r10);font-size:12px;color:var(--t0)}
.search-input:focus{border-color:var(--brand)}
.sessions-list{flex:1;overflow-y:auto;padding:8px}
.sess-card{padding:10px 12px;border-radius:var(--r10);cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:all .15s;position:relative;display:flex;flex-direction:column;gap:5px}
.sess-card:hover{background:var(--s2);border-color:var(--bd2)}
.sess-card:hover .sess-actions{opacity:1}
.sess-card.active{background:var(--brand-soft);border-color:rgba(255,61,94,.35)}
.sess-card.pinned::before{content:'';position:absolute;right:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--brand)}
.sess-card.selected{background:var(--info-soft);border-color:rgba(59,130,246,.4)}
.sess-checkbox{position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:4px;border:2px solid var(--t4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
.sess-checkbox.checked{background:var(--info);border-color:var(--info);color:#fff}
.sess-card-head{display:flex;align-items:center;gap:8px;min-width:0}
.sess-color{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sess-name{flex:1;font-size:12px;font-weight:600;color:var(--t0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.sess-actions .btn-icon{width:22px;height:22px;font-size:11px}
.sess-meta{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--t3)}
.sess-time{font-family:var(--fm);color:var(--brand);font-weight:700}
.sess-target-bar{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:2px}
.sess-target-fill{height:100%;background:var(--brand)}
.bulk-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--info-soft);border-bottom:1px solid rgba(59,130,246,.2);font-size:11px;color:var(--info)}
.bulk-bar-count{font-family:var(--fm);font-weight:700}
.timer-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}
.timer-hero{padding:32px 28px 24px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--bd);background:radial-gradient(ellipse 70% 60% at 50% 0%,var(--brand-soft) 0%,transparent 70%)}
.timer-mode{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);margin-bottom:16px}
.timer-mode-btn{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer}
.timer-mode-btn.active{background:var(--brand);color:#fff}
.timer-clock{font-family:var(--fm);font-size:64px;font-weight:700;color:var(--brand);letter-spacing:6px;font-variant-numeric:tabular-nums;text-shadow:0 0 50px rgba(255,61,94,.4);user-select:none;line-height:1}
.timer-clock.running{animation:clockPulse 2.5s ease-in-out infinite}
@keyframes clockPulse{0%,100%{text-shadow:0 0 50px rgba(255,61,94,.4)}50%{text-shadow:0 0 80px rgba(255,61,94,.75)}}
.timer-clock.pomodoro-running{color:var(--success);text-shadow:0 0 50px rgba(16,185,129,.5)}
.timer-clock.idle-paused{color:var(--warning)}
.timer-clock.break-mode{color:var(--info);text-shadow:0 0 50px rgba(59,130,246,.5)}
.timer-label-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.timer-status-dot{width:7px;height:7px;border-radius:50%;background:var(--t4)}
.timer-status-dot.on{background:var(--brand);box-shadow:0 0 12px var(--brand)}
.timer-status-dot.on.pomodoro{background:var(--success)}
.timer-status-dot.on.idle{background:var(--warning)}
.timer-status-dot.on.break-mode{background:var(--info)}
.timer-status-text{font-size:11px;color:var(--t3);font-weight:600;font-family:var(--fm)}
.timer-sess-pill{padding:4px 11px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);font-size:11px;color:var(--t2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-bar{padding:12px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap}
.tag-bar-label{font-size:11px;color:var(--t3);font-weight:700}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tag-chip-wrap{display:inline-flex;align-items:center;gap:2px}
.tag-chip{padding:5px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--s2);font-size:11px;font-weight:600;color:var(--t2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tag-chip:hover{border-color:var(--t4);color:var(--t0)}
.tag-chip.active{color:#fff;border-color:transparent}
.tag-chip-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag-edit-btn{width:20px;height:20px;border-radius:var(--r6);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--t4);opacity:0;cursor:pointer}
.tag-chip-wrap:hover .tag-edit-btn{opacity:1}
.ctrl-bar{padding:14px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-spacer{flex:1}
.ctrl-main{display:flex;gap:6px}
.logs-area{flex:1;overflow-y:auto;min-height:0;padding:8px 0}
.log-row{display:flex;align-items:center;gap:12px;padding:11px 28px;transition:background .15s;position:relative}
.log-row::before{content:'';position:absolute;right:0;top:8px;bottom:8px;width:3px;background:var(--log-color,var(--brand));opacity:.6;border-radius:2px}
.log-row:hover{background:var(--s1)}
.log-row:hover .log-actions{opacity:1}
.log-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
/* 2t: tag names appear in three places — the selector chips (.tag-chip), the log rows
   (.log-tag-name) and the summary bar (.summary-tag-name). The no-wrap/ellipsis guard
   lived only on .tag-chip, so a log row still broke Persian words character by character. */
.log-tag-name,.summary-tag-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:keep-all;overflow-wrap:normal;min-width:0;max-width:200px}
.log-act-more{display:none}
.log-tag-name{font-size:12px;font-weight:600;flex:0 1 auto}
.log-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--s3);color:var(--t3);border:1px solid var(--bd);font-family:var(--fm)}
/* the range badge must fit 'HH:MM:SS-HH:MM:SS'; two classes so it also wins over the phone
   block's .log-badge{max-width:64px} cap, which was clipping the leading digits away */
.log-badge.log-time-badge{flex:0 0 auto;white-space:nowrap;overflow:visible;text-overflow:clip;direction:ltr;unicode-bidi:isolate;min-width:max-content;max-width:none}
.log-note-icon{font-size:11px;color:var(--info);cursor:help}
.log-right{display:flex;align-items:center;gap:10px}
.log-time{font-family:var(--fm);font-size:14px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.log-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.log-actions .btn-icon{width:26px;height:26px;font-size:11px}
.summary-bar{padding:12px 28px;background:var(--s1);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.summary-tags{display:flex;gap:14px;flex-wrap:wrap;flex:1}
.summary-tag-item{display:flex;align-items:center;gap:5px;font-size:12px}
.summary-tag-dot{width:7px;height:7px;border-radius:50%}
.summary-tag-name{color:var(--t2)}
.summary-tag-time{font-family:var(--fm);color:var(--brand);font-weight:700}
.summary-total{font-family:var(--fm);font-size:13px;font-weight:700;padding:7px 14px;border-radius:var(--r10);background:var(--brand-soft);border:1px solid var(--brand-soft)}
.cal-header-bar{padding:16px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cal-nav-btn{width:34px;height:34px;border-radius:var(--r10);background:var(--s2);border:1px solid var(--bd);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.cal-nav-btn:hover{background:var(--s3);color:var(--t0)}
.cal-title-block{display:flex;align-items:baseline;gap:10px;flex:1;justify-content:center}
.cal-month-label{font-size:19px;font-weight:800;cursor:pointer;padding:4px 12px;border-radius:var(--r10)}
.cal-month-label:hover{background:var(--s2);color:var(--brand)}
.cal-year-label{font-family:var(--fm);font-size:13px;font-weight:700;color:var(--brand);cursor:pointer;padding:4px 10px;border-radius:var(--r10)}
.cal-today-btn{padding:7px 14px;border-radius:var(--r10);font-size:11px;font-weight:600;background:var(--s2);border:1px solid var(--bd);color:var(--t2);cursor:pointer}
.cal-today-btn:hover{background:var(--brand-soft);color:var(--brand)}
.cal-body{flex:1;overflow-y:auto;padding:20px 24px}
.week-headers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.week-header{text-align:center;font-size:11px;font-weight:700;color:var(--brand);padding:6px 0}
.week-header.weekend{color:var(--t3)}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-cell{background:var(--s1);border-radius:var(--r10);padding:9px 10px;min-height:82px;position:relative;cursor:pointer;border:1px solid var(--bd);transition:all .15s}
.day-cell:hover{border-color:rgba(255,61,94,.4);background:var(--s2)}

@media (max-width:720px){.sessions-panel{display:none}.timer-clock{font-size:38px;letter-spacing:2px}.timer-hero{padding:22px 16px}.tag-bar,.ctrl-bar,.summary-bar{padding-left:16px;padding-right:16px}.log-row{padding-left:16px;padding-right:16px}.cal-body,.page-inner{padding:14px 16px}.day-cell{min-height:64px;padding:6px 8px}.summary-tags{display:none}.modal{width:95vw!important}.topbar{padding:0 12px}.topbar-search-text,.topbar-search-kbd{display:none}}
/* ═══════════════════════════════════════════════════════════════════════════
   RESPONSIVE LAYOUT (2i) — phone → 4K/TV
   Breakpoints (one system, documented once):
     ≤380px        small phones          | 381–480px  standard phones
     481–768px     large phones / small tablets
     769–1024px    tablets               | 1025–1366px small laptops
     1367–1920px   standard desktop      | 1921–2560px large desktop / ultrawide
     ≥2561px       4K / TV (10-foot UI, overscan-safe margins, D-pad focus)
   At ≤820px the sidebar becomes a bottom navigation bar; 821–1180px an icon rail.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--chrome-b:0px}

/* ── tag chips (S2) ──
   A word must never break mid-word: keep it whole and ellipsize, so a chip is always one
   line tall (the reported chip wrapped into three: کد / نویسی / ن). The full name stays
   available through the title attribute the renderer always sets. */
.tag-chip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;min-width:0;word-break:keep-all;overflow-wrap:normal}
.tag-chip-dot{flex:0 0 auto}
.tag-chip-wrap{flex:0 0 auto}

/* ── one-thumb primary timer action (2p) ──
   Desktop keeps its existing transport row; phones get a single full-width primary
   button whose label/colour track the timer state, a compact secondary row, and a ⋯
   menu for the actions that are not worth a row of their own. */
#btn-primary,#btn-ctrl-overflow{display:none}

/* ── fixed add-session FAB (R1/S4) ──
   `--chrome-b` is the measured height of whatever chrome sits at the bottom of the
   viewport (bottom nav bar + the summary bar riding on it), written by
   UI.syncChromeMetrics(), so the FAB can never overlap it. The app is RTL-only
   (dir="rtl"), so the physical left corner is the "end" corner requested. */
.fab{display:none;position:fixed;z-index:900;left:calc(16px + var(--safe-l));bottom:calc(var(--chrome-b) + 16px + var(--safe-b));width:60px;height:60px;min-width:56px;min-height:56px;border-radius:50%;border:none;background:var(--brand-grad);color:#fff;font-size:26px;font-weight:700;line-height:1;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent}
.fab:hover{filter:brightness(1.08)}
.fab:active{transform:scale(.95)}
.fab:focus-visible{outline:2px solid var(--t0);outline-offset:3px}
@media (max-width:1024px){.fab{display:flex;bottom:calc(var(--chrome-b) + 60px + var(--safe-b))}}
@media (pointer:coarse){.fab{width:64px;height:64px;font-size:28px}}

/* ── shell: dynamic viewport height, never a horizontal scrollbar ── */
html,body{height:100dvh;max-width:100%;overflow-x:hidden}
.app{height:100dvh;max-width:100%}
.main,.page,.timer-panel,.page-inner,.sessions-panel{min-width:0;max-width:100%}
/* min-height:0 on the whole vertical flex chain: without it a flex item refuses to shrink
   below its content, so .timer-panel overflowed .page and its last bar (the summary bar)
   was clipped by overflow:hidden — invisible on 320x568 and behind the nav bar at 375. */
.main,.page,.timer-panel,.sessions-panel{min-height:0}
.page-inner{overflow-x:hidden}
.log-row,.metric-sub,.modal-body,.palette,.topbar-title,.log-note{overflow-wrap:anywhere}
img,video,table{max-width:100%}
canvas{max-width:100%}
/* the compare canvas is allowed to exceed its wrapper: dense series widen it and the
   wrapper scrolls horizontally instead of compressing the plot */
#cmp-canvas-wrap{overflow-x:auto;overflow-y:hidden}
#cmp-canvas-wrap canvas{display:block;max-width:none}
@supports not (height:100dvh){html,body,.app{height:100vh}}

/* keyboard / D-pad focus is always visible */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ── touch devices: 44px targets, and no action may live behind :hover ── */
@media (pointer:coarse){
  .btn,.nav-item,.btn-icon,.icon-btn,.toggle,.tab,.ctx-item,.picker-item,.timer-mode-btn,.sb-link{min-height:44px}
  .btn{min-width:44px}
  .btn-icon,.icon-btn{width:44px;height:44px}
  /* these two are more specific in the base sheet (22px/26px) — touch needs 44 */
  .sess-actions .btn-icon,.log-actions .btn-icon{width:44px;height:44px;font-size:13px}
  .toggle{min-width:44px}
  .sess-actions,.log-actions,.day-menu,.tag-edit-btn{opacity:1!important;visibility:visible!important}
  .day-menu,.tag-edit-btn{width:44px;height:44px;font-size:16px}
}

/* ── ≤820px: phones and small tablets — sidebar becomes a bottom nav bar ── */
@media (max-width:820px){
  .app{flex-direction:column-reverse}
  .sidebar{width:100%;max-width:100%;height:auto;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;overflow:visible;gap:2px;border-left:none;border-top:1px solid var(--bd);padding:4px calc(6px + var(--safe-r)) calc(4px + var(--safe-b)) calc(6px + var(--safe-l))}
  .brand,.sb-label,.sb-spacer,.sb-footer,.sb-links{display:none}
  /* display:contents dissolves the two <nav> wrappers so all 9 items share one
     wrapping row flow instead of wrapping per section (which cost a 3rd row at 320px) */
  .sb-section,.nav{display:contents}
  .sb-section{margin:0!important}
  .nav-item{position:relative;flex:0 0 auto;width:auto;max-width:96px;flex-direction:column;gap:1px;justify-content:center;min-width:48px;min-height:44px;padding:3px 4px;font-size:9.5px;line-height:1.2;border-radius:var(--r10)}
  .nav-item .nav-icon{font-size:17px;line-height:1}
  .nav-badge{margin:0;position:absolute;top:1px;inset-inline-end:3px;font-size:8px;padding:0 4px;min-width:14px}
  .main{width:100%;min-height:0}
  .topbar{height:auto;min-height:52px;padding:calc(4px + var(--safe-t)) 10px 4px;gap:8px;flex-wrap:wrap}
  .topbar-search{flex:1 1 100%;max-width:none;height:40px;order:9}
  .topbar-stats{gap:6px;flex-wrap:wrap}
  #page-timer{flex-wrap:nowrap}
  /* The timer panel is a fixed set of bars plus a scrolling log list. As a flex column
     the log list kept its content height and pushed the summary bar out of the panel
     (clipped by overflow:hidden at 320x568 and behind the nav bar at 375). As a grid the
     rows are deterministic: only the log row flexes, and it scrolls. */
  .timer-panel{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;overflow:hidden}
  .timer-panel>*{min-height:0}
  .logs-area{overflow-y:auto;max-height:100%}  /* % here resolves against the grid row (see above), so the list clamps to its row instead of overflowing it */
  .sessions-panel{display:none}
  .timer-hero{padding:14px 12px}
  .timer-clock{font-size:clamp(30px,11vw,46px);letter-spacing:1px}
  .tag-bar,.ctrl-bar,.summary-bar{padding-left:10px;padding-right:10px}
  .summary-bar{row-gap:4px}
  .page-inner{padding:12px 12px calc(var(--chrome-b) + 90px + var(--safe-b))}
  .logs-area{padding-bottom:calc(var(--chrome-b) + 84px)}
  /* no wrapping on phones: wrapped bars grew to ~160px each and pushed the summary bar
     (and the log list) off the bottom of a 320x568 screen. They scroll instead. */
  .tag-bar,.ctrl-bar,.summary-bar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0}
  .tag-bar::-webkit-scrollbar,.ctrl-bar::-webkit-scrollbar,.summary-bar::-webkit-scrollbar{display:none}
  .tag-bar>*,.ctrl-bar>*,.summary-bar>*{flex:0 0 auto}
  /* modals become bottom sheets and can never exceed the visible viewport */
  .overlay{padding:0;align-items:flex-end}
  .modal{width:100%!important;max-width:100%;max-height:92dvh;border-radius:var(--r20) var(--r20) 0 0;padding-bottom:var(--safe-b)}
  .modal-footer{position:sticky;bottom:0;background:var(--s1);border-top:1px solid var(--bd)}
  .ctx-menu{min-width:0;max-width:92vw;width:auto}
  .toasts{bottom:calc(var(--chrome-b) + 16px + var(--safe-b));max-width:94vw}
  .palette-overlay{padding-top:5vh}
  .palette{width:min(96vw,720px)}
}
@media (max-width:480px){
  .timer-clock{font-size:clamp(32px,10.5vw,48px)}
  /* the tag row scrolls as one line with snap points: chip(s) then a compact + button */
  .tag-list{scroll-snap-type:x proximity}
  .tag-chip-wrap{scroll-snap-align:start}
  .tag-chip,.log-tag-name,.summary-tag-name{max-width:140px}
  /* 2t: a guaranteed slice for the tag inside a log row (5 x 44px action buttons + the
     time badge used to leave it 0px wide), and the secondary actions move to ⋯ */
  /* phones: the row becomes a two-line card so the tag gets the full width instead of the
     ~90px left over after four 44px action buttons (tap targets stay 44px) */
  .log-row{flex-wrap:wrap;row-gap:6px;padding:10px 12px}
  .log-info{flex:1 1 100%}
  .log-right{flex:1 1 100%;order:2;justify-content:flex-start;gap:6px}
  .log-tag-name{min-width:2.6em}
  .log-actions{gap:4px}
  .log-act-2{display:none}
  .log-act-more{display:inline-flex}
  .log-badge{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log-badge.log-time-badge{max-width:none}
  .log-info{gap:6px}
  .tag-chip{padding:4px 10px}
  .tag-bar{gap:6px}
  .tag-bar-label{flex:0 0 auto;font-size:10px}
  .ctrl-bar{gap:6px}
  .tag-bar [data-action="new-tag"]{flex:0 0 auto;min-width:44px;min-height:44px;padding:0;font-size:0}
  .tag-bar [data-action="new-tag"]::before{content:"+";font-size:20px;font-weight:700}
  /* the timer panel becomes: one dominant action, then a compact icon row */
  .ctrl-bar{display:grid;grid-template-columns:1fr auto;grid-template-areas:"primary primary" "second overflow";gap:8px;padding:10px 12px;min-height:128px;flex:0 0 auto;overflow:visible;height:auto}
  #btn-primary{display:flex;grid-area:primary;width:100%;min-height:56px;font-size:16px;justify-content:center;border-radius:var(--r14)}
  .ctrl-main{grid-area:second;display:flex;gap:8px}
  #btn-ctrl-overflow{display:inline-flex;grid-area:overflow;width:44px;height:44px;font-size:20px}
  #btn-start{display:none}
  #btn-pause,#btn-stop{min-width:44px;min-height:44px;padding:0;font-size:16px}
  .ctrl-bar:not([data-state="running"]) #btn-pause{display:none}
  .ctrl-bar:not([data-state="paused"]) #btn-stop{display:none}
  .ctrl-spacer{display:none}
  .ctrl-bar [data-action="quick-start"],.ctrl-bar [data-action="manual-log"],.ctrl-bar [data-action="assign"]{display:none}
  /* one topbar row instead of two, and only the streak pill (2p) */
  .topbar{flex-wrap:nowrap;gap:6px;min-height:48px}
  .topbar-search{flex:1 1 auto;min-width:0;height:36px;order:0}
  .topbar-stats{flex-wrap:nowrap}
  .topbar-stats .pill:not(.accent){display:none}
  .metric-grid,.compare-summary,.summary-tags{grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr))}
  .compare-wrap{padding:12px}
  .compare-tabs{gap:4px}
  .metric-card,.compare-card{padding:10px}
  .modal-title{font-size:15px}
  .toasts{bottom:calc(var(--chrome-b) + 16px + var(--safe-b))}
}
@media (max-width:380px){
  .nav-item{min-width:44px;min-height:44px;font-size:9px;padding:2px 2px}
  .nav-item .nav-icon{font-size:16px}
  .timer-clock{font-size:clamp(28px,11vw,36px)}
  .topbar,.tag-bar,.ctrl-bar,.summary-bar{padding-left:8px;padding-right:8px}
  /* at 320px the title wrapped to 99px in a 23px box: drop the topbar icon buttons
     (theme / focus / PiP are all reachable from Settings) and keep title + search + streak */
  .topbar-stats .icon-btn{display:none}
  .topbar-title{flex:0 0 auto;white-space:nowrap}
  .page-inner{padding-left:8px;padding-right:8px}
  .btn{padding-left:10px;padding-right:10px}
}
/* short phones (320x568 class): trim the hero so the fixed chrome fits without clipping */
@media (max-height:700px){
  .timer-hero{padding:6px 10px}
  .timer-mode{margin-bottom:5px;padding:3px}
  .timer-clock{font-size:clamp(24px,7vh,38px)}
  .timer-label-row{gap:6px}
  .tag-bar,.summary-bar{min-height:44px}
  /* On a viewport this short the fixed chrome leaves no usable room for the log list, so
     the panel itself scrolls (nothing is hidden) instead of clamping the list to zero.
     The primary action stays above the fold in both cases. */
  .timer-panel{overflow-y:auto;grid-template-rows:auto auto auto auto auto}
  .logs-area{flex:1 1 0;min-height:0;max-height:none}
}
/* landscape phones: shorter chrome, centred modals */
@media (orientation:landscape) and (max-height:560px){
  .timer-hero{padding:8px 12px}
  .timer-clock{font-size:clamp(24px,6vh,40px)}
  .topbar{min-height:44px}
  .sidebar{max-height:64px;overflow-y:hidden}
  .overlay{align-items:center;padding:8px}
  .modal{max-height:96dvh;border-radius:var(--r20)}
}
@media (min-width:481px) and (max-width:820px){
  .timer-clock{font-size:clamp(44px,8vw,64px)}
}

@media (min-width:769px){.compare-legend{font-size:13px}}
@media (min-width:1025px){.compare-legend{font-size:14px}}

/* ── 821–1180px: tablet / small laptop — sidebar collapses to an icon rail ── */
@media (min-width:821px) and (max-width:1180px){
  :root{--sw:78px}
  .brand,.sb-label,.sb-footer,.sb-links{display:none}
  .sidebar .nav-item>span:not(.nav-icon):not(.nav-badge){display:none}
  .brand{justify-content:center;padding:8px 0}
  .nav-item{justify-content:center;gap:0;padding:12px 0;min-height:48px;width:100%}
  .sb-section{margin:0!important}
}

/* ── ≥1921px: ultrawide — keep the UI readable instead of stretched ── */
@media (min-width:1921px){
  .page{max-width:1600px;margin:0 auto;width:100%}
  body{font-size:15px}
}

/* ── ≥2561px: 4K / TV — 10-foot UI, overscan-safe, D-pad friendly ── */
@media (min-width:2561px){

  body{font-size:clamp(16px,0.62vw,24px)}
  .app{padding:5vh 5vw}
  .page{max-width:2300px}
  .timer-clock{font-size:clamp(84px,5.2vw,180px)}
  .timer-hero{padding:40px 32px 32px}
  .nav-item{min-height:64px;padding:14px 16px;font-size:clamp(14px,0.72vw,22px);gap:14px}
  .nav-item .nav-icon{font-size:26px}
  .btn,.icon-btn,.toggle,.ctx-item,.tab,.picker-item,.sb-link,.timer-mode-btn{min-height:56px}
  .btn,.icon-btn,.sb-link,.toggle,.timer-mode-btn{min-width:56px}
  .btn-icon{width:56px;height:56px;min-width:56px;font-size:18px}
  .metric-card,.compare-card{padding:22px}
  .log-row{padding:18px 24px}
  .modal{width:min(1200px,80vw);max-height:80dvh}
  .ctx-menu{min-width:320px;font-size:clamp(14px,0.7vw,20px)}
  :focus-visible{outline:4px solid var(--brand);outline-offset:4px}
}

  // R1/S4: how much chrome sits at the bottom of the viewport right now. Walks the
  // bottom stack (a bar counts when it touches the bottom OR rides directly on top of

  syncChromeMetrics(){
    try{
      const vh=window.innerHeight||0;let need=0;
      const bars=['.sidebar','.page.active .summary-bar','.page.active .ctrl-bar','.page.active .tag-bar'];
      for(let pass=0;pass<3;pass++){
        let grew=false;
        bars.forEach(function(sel){
          const el=document.querySelector(sel);if(!el)return;

          if(gap<-1)return;
          if(gap<=need+2){const cand=gap+b.height;if(cand>need+1){need=cand;grew=true}}

const PDatePicker={
  show(opts){
    opts=opts||{};
    return new Promise(resolve=>{
      const initial=opts.initial||Cal.today();
      let curY=initial.y,curM=initial.m,curD=initial.d;
      const ov=document.createElement('div');
      ov.className='overlay';
      const rebuild=()=>{
        const nDays=Cal.daysInMonth(curY,curM);
        const fw=Cal.firstWeekday(curY,curM);
        let gridHTML='';
        WEEKDAYS.forEach(w=>{gridHTML+='<div class="pdate-cell pdate-header-cell">'+w+'</div>'});
        for(let i=0;i<fw;i++)gridHTML+='<div class="pdate-cell pdate-other"></div>';
        const today=Cal.today();
        for(let d=1;d<=nDays;d++){
          const isToday=today.y===curY&&today.m===curM&&today.d===d;
          const isSel=d===curD;
          let cls='pdate-cell';
          if(isToday)cls+=' pdate-today';
          if(isSel)cls+=' pdate-selected';
          gridHTML+='<button class="'+cls+'" data-day="'+d+'">'+d+'</button>';
        }
        ov.innerHTML='<div class="pdate-picker">'+
          '<div class="pdate-header">'+
            '<button class="pdate-nav" data-prev>▶</button>'+
            '<span class="pdate-title">'+MONTHS[curM-1]+' '+curY+'</span>'+
            '<button class="pdate-nav" data-next>◀</button>'+
          '</div>'+
          '<div class="pdate-grid">'+gridHTML+'</div>'+
          '<div style="display:flex;justify-content:space-between;margin-top:10px"><button class="btn btn-ghost btn-sm" data-today2>امروز</button><button class="btn btn-ghost btn-sm" data-cancel2>لغو</button></div>'+
        '</div>';
        ov.querySelector('[data-prev]').onclick=()=>{curM--;if(curM<1){curM=12;curY--;if(curY<YEAR_MIN)curY=YEAR_MIN}rebuild()};
        ov.querySelector('[data-next]').onclick=()=>{curM++;if(curM>12){curM=1;curY++;if(curY>YEAR_MAX)curY=YEAR_MAX}rebuild()};
        ov.querySelector('[data-today2]').onclick=()=>{const t=Cal.today();ov.remove();resolve({y:t.y,m:t.m,d:t.d})};
        ov.querySelector('[data-cancel2]').onclick=()=>{ov.remove();resolve(null)};
        ov.querySelectorAll('[data-day]').forEach(b=>{
          b.onclick=()=>{const d=+b.dataset.day;ov.remove();resolve({y:curY,m:curM,d:d})};
        });
      };
      rebuild();
      document.body.appendChild(ov);
      ov.addEventListener('click',e=>{if(e.target===ov){ov.remove();resolve(null)}});
    });
  }
};

  renderLogs(){

  async editLogNote(idx){const s=Store.data.sessions.find(x=>x.id===Store.data.ui.activeSessionId);if(!s)return;const log=s.logs[idx];if(!log)return;const n=await Modal.prompt('یادداشت','',log.note||'',{multiline:true});if(n===null)return;log.note=n;await Store.saveNow();this.renderLogs()},
  backdateLog(idx){
    const s=Store.data.sessions.find(x=>x.id===Store.data.ui.activeSessionId);if(!s)return;
    const log=s.logs[idx];if(!log)return;
    let end=new Date();if(log.endTs)end=new Date(log.endTs);else if(log.ts)end=new Date(log.ts);
    let start=new Date(end.getTime()-(log.seconds||log.minutes*60)*1000);
    if(log.startTs)start=new Date(log.startTs);
    const p2=n=>String(n).padStart(2,'0');
    const dateVal=start.getFullYear()+'-'+p2(start.getMonth()+1)+'-'+p2(start.getDate());
    const startVal=p2(start.getHours())+':'+p2(start.getMinutes());
    const endVal=p2(end.getHours())+':'+p2(end.getMinutes());
    Modal.open('<div class="modal-title">🕐 ویرایش زمان</div><button class="btn-icon" data-close>✕</button>',
      '<div class="modal-section"><label class="form-label">تاریخ</label><input type="date" class="form-input" data-date value="'+dateVal+'"></div>'+
      '<div class="modal-section" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="form-label">از</label><input type="time" class="form-input" data-start value="'+startVal+'"></div><div><label class="form-label">تا</label><input type="time" class="form-input" data-end value="'+endVal+'"></div></div>'+
      '<div class="kv-row" style="background:var(--brand-soft)"><span class="kv-label" style="color:var(--brand);font-weight:700">مدت</span><span class="kv-val" style="color:var(--brand)" data-dur>—</span></div>',
      '<button class="btn btn-primary" data-ok>ذخیره</button><button class="btn btn-ghost" data-cancel>انصراف</button>',
      'modal-md',(ov,close)=>{
        const dEl=ov.querySelector('[data-date]'),sEl=ov.querySelector('[data-start]'),eEl=ov.querySelector('[data-end]'),durEl=ov.querySelector('[data-dur]');
        const calc=()=>{if(!dEl.value||!sEl.value||!eEl.value)return 0;const dp=dEl.value.split('-').map(Number),sp=sEl.value.split(':').map(Number),ep=eEl.value.split(':').map(Number);const sd=new Date(dp[0],dp[1]-1,dp[2],sp[0],sp[1]),ed=new Date(dp[0],dp[1]-1,dp[2],ep[0],ep[1]);let mins=Math.round((ed-sd)/60000);if(mins<0)mins+=1440;durEl.textContent=Fmt.hm(mins);return mins};
        dEl.onchange=sEl.onchange=eEl.onchange=calc;calc();
        ov.querySelector('[data-close]').onclick=close;
        ov.querySelector('[data-cancel]').onclick=close;
        ov.querySelector('[data-ok]').onclick=async()=>{
          const mins=calc();if(mins<=0){Toast.error('مدت > ۰');return}
          const dp=dEl.value.split('-').map(Number),sp=sEl.value.split(':').map(Number),ep=eEl.value.split(':').map(Number);
          const sd=new Date(dp[0],dp[1]-1,dp[2],sp[0],sp[1]),ed=new Date(dp[0],dp[1]-1,dp[2],ep[0],ep[1]);
          if(ed<sd)ed.setDate(ed.getDate()+1);
          log.startTs=sd.toISOString();log.endTs=ed.toISOString();
          log.minutes=mins;log.seconds=mins*60;log.ts=log.startTs;log.edited=true;
          Store.syncEventFromLog(log,{dur:log.seconds,ts:log.endTs,dk:Store.dkOfTs(log.startTs)});
          await Store.saveNow();this.renderLogs();this.renderSessions();close();Toast.success('ویرایش شد');
        };
      });
  },
  splitLog(idx){

      '<button class="btn btn-primary" data-ok>تقسیم</button><button class="btn btn-ghost" data-cancel>انصراف</button>',
      'modal-md',(ov,close)=>{
        const p1=ov.querySelector('[data-part1]'),rest=ov.querySelector('[data-rest]'),tag2=ov.querySelector('[data-tag2]');
        const calc=()=>{try{const m1=Fmt.parseMins(p1.value);const r=totalMins-m1;rest.textContent=r>0?Fmt.hm(r):'—';return m1}catch(e){rest.textContent='—';return 0}};

  async editLog(idx){const s=Store.data.sessions.find(x=>x.id===Store.data.ui.activeSessionId);if(!s)return;const log=s.logs[idx];if(!log)return;const v=await Modal.prompt('ویرایش دقیقه','H:MM',Fmt.hm(log.minutes),{placeholder:'1:30',durationPreview:true});if(!v)return;try{const newM=Fmt.parseMins(v);log.minutes=newM;log.seconds=newM*60;if(log.startTs)log.endTs=new Date(new Date(log.startTs).getTime()+newM*60000).toISOString();Store.syncEventFromLog(log,{dur:log.seconds,ts:log.endTs});await Store.saveNow();this.renderLogs();this.renderSessions();Toast.success('ویرایش شد')}catch(e){Toast.error('فرمت اشتباه')}},
  async deleteLog(idx){const s=Store.data.sessions.find(x=>x.id===Store.data.ui.activeSessionId);if(!s)return;const ok=await Modal.confirm('حذف لاگ','حذف بشه؟',{danger:true,confirmText:'حذف'});if(!ok)return;const r=s.logs.splice(idx,1)[0];Store.dropEventForLog(r.id);Store.data.trash.logs.push(Object.assign({},r,{sessionId:s.id,sessionName:s.name,deletedAt:new Date().toISOString()}));await Store.saveNow();this.renderLogs();this.renderSessions();UI.updateGlobalStats();Toast.undo('حذف شد',()=>{const li=Store.data.trash.logs.findIndex(x=>x.id===r.id);if(li<0)return;const rl=Store.data.trash.logs.splice(li,1)[0];delete rl.deletedAt;delete rl.sessionId;delete rl.sessionName;s.logs.push(rl);Store.rebuildEventForLog(s.id,rl,'restored');Store.save();this.renderLogs();this.renderSessions();UI.updateGlobalStats()})},
  async manualLog(){const sId=Store.data.ui.activeSessionId;if(!sId){Toast.error('سشن باز کن');return}const tag=Store.data.ui.activeTag;if(!tag){Toast.error('تگ انتخاب کن');return}const v=await Modal.prompt('لاگ دستی','H:MM','',{placeholder:'1:30',durationPreview:true});if(!v)return;try{const m=Fmt.parseMins(v);if(m<=0)throw new Error('bad');const s=Store.data.sessions.find(x=>x.id===sId);if(!s)return;const end=new Date();const start=new Date(end.getTime()-m*60000);const lg={id:Store.id(),tag:tag,minutes:m,seconds:m*60,ts:end.toISOString(),startTs:start.toISOString(),endTs:end.toISOString(),manual:true,note:''};s.logs.push(lg);Store.recordEvent({ts:lg.ts,dk:Store.dkOfTs(lg.startTs),type:'manual',sessionId:sId,tag:tag,dur:m*60,src:'manual',logId:lg.id});await Store.saveNow();this.renderLogs();this.renderSessions();Toast.success('اضافه شد')}catch(e){Toast.error('فرمت اشتباه')}},
  assignToCalendar(){const sId=Store.data.ui.activeSessionId;if(!sId){Toast.error('سشن باز کن');return}const s=Store.data.sessions.find(x=>x.id===sId);if(!s||!s.logs.length){Toast.error('لاگ نداره');return}Pages.Calendar.pickMode=s;Router.go('calendar');Toast.info('روز رو انتخاب کن')},

/* ═══════ TIMELINE PAGE ═══════ */
Pages.Timeline={
  render(){
    const d=Store.data;const today=Cal.today();
    if(!d.ui.timelineDate||!Fmt.validDateKey(d.ui.timelineDate))d.ui.timelineDate=Fmt.dateKey(today.y,today.m,today.d);
    const dk=d.ui.timelineDate;
    const dp=Fmt.parseDateKey(dk);
    const tlDate=document.getElementById('tl-date');
    if(tlDate)tlDate.textContent=Fmt.pDateFullFromDate(new Date(Cal.toGregorian(dp.y,dp.m,dp.d).gy,Cal.toGregorian(dp.y,dp.m,dp.d).gm-1,Cal.toGregorian(dp.y,dp.m,dp.d).gd));
    const dayLogs=[];
    d.sessions.forEach(s=>{
      s.logs.forEach(l=>{
        let ref=null;
        if(l.startTs)ref=new Date(l.startTs);else if(l.ts)ref=new Date(l.ts);
        if(!ref)return;
        const p=Cal.fromGregorian(ref.getFullYear(),ref.getMonth()+1,ref.getDate());
        const ldk=Fmt.dateKey(p.y,p.m,p.d);
        if(ldk===dk)dayLogs.push(Object.assign({},l,{sessionId:s.id,sessionName:s.name,sessionColor:s.color,logTime:ref,startTime:l.startTs?new Date(l.startTs):new Date(ref.getTime()-(l.seconds||l.minutes*60)*1000)}));
      });
    });
    dayLogs.sort((a,b)=>a.startTime-b.startTime);
    const totalSec=dayLogs.reduce((a,l)=>a+(l.seconds||l.minutes*60),0);
    const breaks=d.breaks.filter(b=>b.date===dk);
    const breakSec=breaks.reduce((a,b)=>a+(b.seconds||b.minutes*60),0);
    const totalsEl=document.getElementById('tl-totals');
    if(totalsEl)totalsEl.innerHTML=
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">جمع کل</div><div style="font-family:var(--fm);font-size:20px;font-weight:800;color:var(--brand)">'+Fmt.dur(totalSec)+'</div></div>'+
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">تعداد بلوک</div><div style="font-family:var(--fm);font-size:20px;font-weight:800">'+dayLogs.length+'</div></div>'+
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">سشن‌ها</div><div style="font-family:var(--fm);font-size:20px;font-weight:800">'+new Set(dayLogs.map(l=>l.sessionId)).size+'</div></div>'+
      '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r10);padding:12px 14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">استراحت</div><div style="font-family:var(--fm);font-size:20px;font-weight:800;color:var(--info)">'+Fmt.dur(breakSec)+'</div></div>';
    const wrap=document.getElementById('tl-wrap');if(!wrap)return;
    if(!dayLogs.length){
      wrap.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:140px;gap:8px;color:var(--t3)"><div style="font-size:40px;opacity:.2">📭</div><div>این روز لاگی نداره</div></div>';
    }else{
      let html='<div style="display:flex;padding:6px 0;border-bottom:1px solid var(--bd);background:var(--s2)">';
      for(let h=0;h<24;h++)html+='<div style="flex:1;text-align:center;font-size:9px;font-family:var(--fm);color:var(--t3)">'+h+'</div>';
      html+='</div><div style="position:relative;height:140px">';
      dayLogs.forEach((l,i)=>{
        const start=l.startTime;
        const startH=start.getHours()+start.getMinutes()/60+start.getSeconds()/3600;
        const dur=(l.seconds||l.minutes*60)/3600;
        const leftPct=(startH/24)*100;
        const widthPct=Math.max(0.4,Math.min((dur/24)*100,100-leftPct));
        const color=Store.data.tagColors[l.tag]||'#ff3d5e';
        html+='<div style="position:absolute;top:8px;bottom:8px;right:'+leftPct+'%;width:'+widthPct+'%;border-radius:6px;background:'+color+'80;border:1px solid '+color+';display:flex;align-items:center;justify-content:center;padding:0 6px;cursor:pointer;overflow:hidden" data-i="'+i+'" title="'+Fmt.esc(l.tag)+' — '+Fmt.dur(l.seconds||l.minutes*60)+'"><span style="font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(widthPct>6?Fmt.esc(l.tag):'')+'</span></div>';
      });
      const isToday=dk===Fmt.dateKey(today.y,today.m,today.d);
      if(isToday){
        const now=new Date();
        const nowH=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
        html+='<div style="position:absolute;top:0;bottom:0;right:'+(nowH/24)*100+'%;width:2px;background:var(--brand);box-shadow:0 0 12px var(--brand);z-index:5"></div>';
      }
      html+='</div>';
      wrap.innerHTML=html;
      wrap.querySelectorAll('[data-i]').forEach(el=>{el.onclick=()=>this.showLogDetail(dayLogs[+el.dataset.i])});
    }
    const ent=document.getElementById('tl-entries');
    if(ent){
      ent.innerHTML='';
      if(!dayLogs.length)ent.innerHTML='<div class="empty" style="padding:30px"><div class="empty-icon">📭</div><div class="empty-title">خالیه</div></div>';
      else{
        ent.innerHTML='<div style="font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px">📋 بلوک‌های زمانی<div style="flex:1;height:1px;background:var(--bd)"></div></div>';
        dayLogs.forEach(l=>{
          const c=Store.data.tagColors[l.tag]||'#ff3d5e';
          const row=document.createElement('div');
          row.className='trash-card';
          row.style.cursor='pointer';
          row.innerHTML='<div class="trash-info"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="width:10px;height:10px;border-radius:3px;background:'+c+'"></span><strong style="font-size:13px">'+Fmt.esc(l.tag)+'</strong><span style="font-size:11px;color:var(--t3)">'+Fmt.esc(l.sessionName)+'</span></div><div class="trash-meta">'+Fmt.pTimeRange(l.startTime.toISOString(),l.endTs||null,(l.seconds||l.minutes*60))+'</div></div><div style="font-family:var(--fm);font-weight:700;color:var(--brand)">'+Fmt.dur(l.seconds||l.minutes*60)+'</div>';
          row.onclick=()=>this.showLogDetail(l);
          ent.appendChild(row);
        });
      }
    }
  },
  showLogDetail(l){
    Modal.open('<div class="modal-title">'+Fmt.esc(l.tag)+' — '+Fmt.dur(l.seconds||l.minutes*60)+'</div><button class="btn-icon" data-close>✕</button>',
      '<div class="modal-section"><div class="kv-row"><span class="kv-label">سشن</span><span class="kv-val">'+Fmt.esc(l.sessionName)+'</span></div>'+
        (l.startTs?'<div class="kv-row"><span class="kv-label">شروع</span><span class="kv-val">'+Fmt.pTime(l.startTs)+'</span></div>':'')+
        (l.endTs?'<div class="kv-row"><span class="kv-label">پایان</span><span class="kv-val">'+Fmt.pTime(l.endTs)+'</span></div>':'')+
        (l.note?'<div class="kv-row"><span class="kv-label">یادداشت</span><span class="kv-val" style="font-size:11px">'+Fmt.esc(l.note)+'</span></div>':'')+
        (l.manual?'<div class="kv-row"><span class="kv-label">نوع</span><span class="kv-val">دستی</span></div>':'')+
        (l.pomodoro?'<div class="kv-row"><span class="kv-label">نوع</span><span class="kv-val">🍅 پومودورو</span></div>':'')+
      '</div>',
      '<button class="btn btn-primary" data-goto>برو به سشن</button>','modal-sm',
      (ov,close)=>{ov.querySelector('[data-close]').onclick=close;ov.querySelector('[data-goto]').onclick=()=>{close();Store.data.ui.activeSessionId=l.sessionId;Store.save();Router.go('timer')}});
  },
  prev(){const p=Fmt.parseDateKey(Store.data.ui.timelineDate);const pp=Cal.addDays(p,-1);Store.data.ui.timelineDate=Fmt.dateKey(pp.y,pp.m,pp.d);Store.save();this.render()},
  next(){const p=Fmt.parseDateKey(Store.data.ui.timelineDate);const pp=Cal.addDays(p,1);Store.data.ui.timelineDate=Fmt.dateKey(pp.y,pp.m,pp.d);Store.save();this.render()},
  today(){const t=Cal.today();Store.data.ui.timelineDate=Fmt.dateKey(t.y,t.m,t.d);Store.save();this.render()},
  async pickDate(){const dk=Store.data.ui.timelineDate;const dp=Fmt.parseDateKey(dk);const r=await PDatePicker.show({initial:{y:dp.y,m:dp.m,d:dp.d}});if(!r)return;Store.data.ui.timelineDate=Fmt.dateKey(r.y,r.m,r.d);Store.save();this.render()}
};

/* ═══════ LOGS PAGE ═══════ */
Pages.Logs={
  _selected:new Set(),_t:null,
  render(){
    const tagSel=document.getElementById('lf-tag');const sessSel=document.getElementById('lf-session');
    if(!tagSel||!sessSel)return;
    const curTag=tagSel.value,curSess=sessSel.value;
    tagSel.innerHTML='<option value="">همه تگ‌ها</option>'+Store.data.tags.map(t=>'<option value="'+Fmt.esc(t)+'">'+Fmt.esc(t)+'</option>').join('');
    sessSel.innerHTML='<option value="">همه سشن‌ها</option>'+Store.data.sessions.map(s=>'<option value="'+s.id+'">'+Fmt.esc(s.name)+'</option>').join('');
    tagSel.value=curTag;sessSel.value=curSess;
    this._applyFilters();
  },
  _applyFilters(){
    const search=(document.getElementById('lf-search').value||'').trim().toLowerCase();
    const tag=document.getElementById('lf-tag').value;
    const sessId=document.getElementById('lf-session').value;
    const type=document.getElementById('lf-type').value;
    let logs=Store.allLogs();
    if(search)logs=logs.filter(l=>{const hay=(l.tag+' '+(l.note||'')+' '+l.sessionName).toLowerCase();return hay.includes(search)});
    if(tag)logs=logs.filter(l=>l.tag===tag);
    if(sessId)logs=logs.filter(l=>l.sessionId===+sessId);
    if(type==='manual')logs=logs.filter(l=>l.manual);
    else if(type==='auto')logs=logs.filter(l=>!l.manual&&!l.pomodoro);
    else if(type==='pomodoro')logs=logs.filter(l=>l.pomodoro);
    logs.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    const totalSec=logs.reduce((a,l)=>a+(l.seconds||l.minutes*60),0);
    const sumEl=document.getElementById('logs-summary');
    if(sumEl)sumEl.innerHTML='<span>📊 تعداد: <span style="font-family:var(--fm);color:var(--t0);font-weight:700">'+logs.length+'</span></span><span style="margin-right:16px">⏱ جمع: <span style="font-family:var(--fm);color:var(--t0);font-weight:700">'+Fmt.dur(totalSec)+'</span></span>';
    const bb=document.getElementById('logs-bulk-bar');
    if(bb){
      if(this._selected.size>0){
        bb.innerHTML='<div class="bulk-bar"><span>'+this._selected.size+' انتخاب شده</span><div style="flex:1"></div><button class="btn btn-info btn-xs" data-bulk-tag>🏷</button><button class="btn btn-info btn-xs" data-bulk-move>↗</button><button class="btn btn-danger btn-xs" data-bulk-del>🗑</button><button class="btn btn-ghost btn-xs" data-bulk-clear>لغو</button></div>';
        bb.querySelector('[data-bulk-del]').onclick=()=>this.bulkDelete();
        bb.querySelector('[data-bulk-tag]').onclick=()=>this.bulkChangeTag();
        bb.querySelector('[data-bulk-move]').onclick=()=>this.bulkMove();
        bb.querySelector('[data-bulk-clear]').onclick=()=>{this._selected.clear();this._applyFilters()};
      }else bb.innerHTML='';
    }
    const list=document.getElementById('logs-list');if(!list)return;
    list.innerHTML='';
    if(!logs.length){list.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">نتیجه‌ای نیست</div></div>';return}
    const self=this;
    logs.forEach(l=>{
      const c=Store.data.tagColors[l.tag]||'#ff3d5e';
      const isSel=this._selected.has(l.id);
      const item=document.createElement('div');
      item.className='trash-card'+(isSel?' selected':'');
      const dateStr=l.ts?Fmt.pDateFromDate(new Date(l.ts)):'';
      const timeStr=l.ts?Fmt.pTimeShort(l.ts):'';
      item.innerHTML=
        '<div style="width:18px;height:18px;border-radius:4px;border:2px solid '+(isSel?'var(--info)':'var(--t4)')+';display:flex;align-items:center;justify-content:center;font-size:10px;color:'+(isSel?'#fff':'transparent')+';background:'+(isSel?'var(--info)':'transparent')+';cursor:pointer;flex-shrink:0" data-ch>'+(isSel?'✓':'')+'</div>'+
        '<div class="trash-info">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">'+
            '<span style="padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:'+c+'20;color:'+c+'">'+Fmt.esc(l.tag)+'</span>'+
            '<span style="font-size:11px;color:var(--t3)">'+Fmt.esc(l.sessionName)+'</span>'+
            (l.manual?'<span class="log-badge">دستی</span>':'')+
            (l.pomodoro?'<span class="log-badge">🍅</span>':'')+
          '</div>'+
          (l.note?'<div style="font-size:11px;color:var(--t2);font-style:italic">📝 '+Fmt.esc(l.note)+'</div>':'')+
          '<div class="trash-meta">'+dateStr+' · '+timeStr+'</div>'+
        '</div>'+
        '<div style="font-family:var(--fm);font-size:14px;font-weight:700;color:var(--brand)">'+Fmt.dur(l.seconds||l.minutes*60)+'</div>';
      item.querySelector('[data-ch]').onclick=e=>{e.stopPropagation();if(self._selected.has(l.id))self._selected.delete(l.id);else self._selected.add(l.id);self._applyFilters()};
      item.onclick=()=>{Store.data.ui.activeSessionId=l.sessionId;Store.save();Router.go('timer')};
      list.appendChild(item);
    });
  },

  clearFilters(){document.getElementById('lf-search').value='';document.getElementById('lf-tag').value='';document.getElementById('lf-session').value='';document.getElementById('lf-type').value='';this._selected.clear();this._applyFilters()},
  exportCSV(){

    const rows=logs.map(l=>{
      const d=l.ts?new Date(l.ts):null;
      const ds=d?Fmt.pDateFromDate(d):'';
      const ts=d?Fmt.pTimeShort(l.ts):'';
      const tp=l.manual?'دستی':l.pomodoro?'پومودورو':'تایمر';
      return[ds,ts,l.sessionName,l.tag,l.minutes||0,l.seconds||((l.minutes||0)*60),l.note||'',tp].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',');

  }
};

  async pickMonth(){const items=MONTHS.map((mn,i)=>({label:mn,value:i+1}));const v=await Modal.picker(items,Store.data.ui.calM,3);if(v){Store.data.ui.calTouched=true;Store.data.ui.calM=v;Store.save();this.render()}},
  dayMenu(dk,e){

      {icon:'📋',label:'مشاهده',disabled:!logs.length,fn:()=>this.dayDetail(dk)},
      {icon:'✏',label:'افزودن دستی',fn:()=>this.addManual(dk)},
      {sep:true},
      {icon:'🧊',label:frozen?'حذف Freeze':'Freeze ('+freezesLeft+')',disabled:!frozen&&freezesLeft<=0,fn:()=>this.toggleFreeze(dk)},
      {sep:true},
      {icon:'🗑',label:'پاک‌سازی روز',cls:'danger',disabled:!logs.length,fn:()=>this.clearDay(dk)},
      {icon:'↩',label:'بازیابی',disabled:!Store.data.trash.days[dk],fn:()=>this.restoreDay(dk)}
    ]);
  },
  toggleFreeze(dk){if(Store.data.streakFreezeUsed[dk]){delete Store.data.streakFreezeUsed[dk];Toast.info('حذف شد')}else{if(Store.freezesRemaining()<=0){Toast.error('Freeze تموم شده');return}Store.data.streakFreezeUsed[dk]=true;Toast.success('Freeze فعال شد')}Store.save();this.render();UI.updateGlobalStats()},
  async addManual(dk){const tag=Store.data.ui.activeTag;if(!tag){Toast.error('تگ فعال انتخاب کن');return}const v=await Modal.prompt('افزودن به '+dk,'H:MM','',{placeholder:'1:30',durationPreview:true});if(!v)return;try{const m=Fmt.parseMins(v);if(m<=0)throw new Error('bad');Store.recordEvent({ts:Store.noonOf(dk),dk:dk,type:'manual',sessionId:null,tag:tag,dur:Math.round(m*60),src:'manual-day',logId:null});await Store.saveNow();this.render();UI.updateGlobalStats();Toast.success('اضافه شد')}catch(e){Toast.error('فرمت اشتباه')}},
  async clearDay(dk){
    const eff=Store.evIndex().effDk;
    const evs=Store.data.events.filter(e=>(e.src==='reattribute'?e.to_dk===dk:eff(e)===dk));
    if(!evs.length){Toast.info('این روز خالیه');return}
    const ok=await Modal.confirm('پاک‌سازی','حذف بشه؟',{danger:true,confirmText:'پاک کن'});if(!ok)return;
    Store.data.trash.days[dk]={events:JSON.parse(JSON.stringify(evs)),data:JSON.parse(JSON.stringify(Store.data.calendar[dk]||[])),deletedAt:new Date().toISOString()};
    const ids=evs.map(e=>e.id);

    await Store.saveNow();this.render();UI.updateGlobalStats();
    Toast.undo('پاک شد',()=>{const t=Store.data.trash.days[dk];if(!t)return;Store.restoreEvents(t.events||[]);delete Store.data.trash.days[dk];Store.save();this.render();UI.updateGlobalStats()})
  },

    const e=Store.data.trash.days[dk];if(!e)return;

    else (e.data||[]).forEach(en=>{const m=Number(en.minutes)||0;if(m>0)Store.recordEvent({ts:Store.noonOf(dk),dk:dk,type:'manual',sessionId:null,tag:en.tag,dur:Math.round(m*60),src:'calendar-v10',logId:null})});
    delete Store.data.trash.days[dk];await Store.saveNow();this.render();UI.updateGlobalStats();Toast.success('بازیابی شد')
  },
  assignDay(dk){
    /* event-sourced: emit a 'reattribute' event, never mutate or delete the original (undo-ready) */
    const sess=this.pickMode;if(!sess)return;
    const eff=Store.evIndex().effDk;const froms={};
    (Store.data.events||[]).forEach(e=>{
      if(e.src==='reattribute'||e.sessionId!==sess.id)return;
      const cur=eff(e);if(cur&&cur!==dk)froms[cur]=true;
    });
    const list=Object.keys(froms).sort();
    if(!list.length){Toast.info('این سشن قبلاً روی همین روزه');return}
    list.forEach(from=>Store.recordEvent({ts:new Date().toISOString(),dk:dk,type:'reattribute',sessionId:sess.id,tag:null,dur:0,src:'reattribute',from_dk:from,to_dk:dk,logId:null}));
    Store.save();this.pickMode=null;this.render();UI.updateGlobalStats();

  },
  dayDetail(dk){
    const logs=Store.data.calendar[dk]||[];
    const tot={};logs.forEach(l=>{tot[l.tag]=(tot[l.tag]||0)+l.minutes});
    const total=Object.values(tot).reduce((a,b)=>a+b,0);

    Modal.open('<div class="modal-title">'+Fmt.pDate(dp[0],dp[1],dp[2])+'</div><button class="btn-icon" data-close>✕</button>',
      '<div class="modal-section"><div class="modal-section-title">تایم‌ها</div>'+rows+'<div class="kv-row" style="margin-top:8px;background:var(--brand-soft)"><span class="kv-label" style="color:var(--brand);font-weight:700">جمع</span><span class="kv-val" style="color:var(--brand)">'+Fmt.durHuman((total)*60000)+'</span></div></div>',

    div.querySelector('[data-check]').onclick=()=>this.toggle(scope,i);

  add(scope){const inp=document.getElementById('goal-input');if(!inp)return;const t=inp.value.trim();if(!t)return;if(!Store.data.goals[scope])Store.data.goals[scope]=[];Store.data.goals[scope].push({text:t,done:false,createdAt:new Date().toISOString(),subtasks:[],targetMinutes:0,tag:null,streak:0,lastCompleted:null});Store.save();this.render();UI.updateGlobalStats()},
  toggle(scope,i){const it=Store.data.goals[scope][i];it.done=!it.done;if(it.done&&(scope==='daily'||scope==='recurring')){const t=Cal.today();const td=Fmt.dateKey(t.y,t.m,t.d);const yp=Cal.addDays(t,-1);const yd=Fmt.dateKey(yp.y,yp.m,yp.d);if(it.lastCompleted===yd)it.streak=(it.streak||0)+1;else if(it.lastCompleted!==td)it.streak=1;it.lastCompleted=td}Store.save();this.render();UI.updateGlobalStats()},
  async edit(scope,i){const it=Store.data.goals[scope][i];const v=await Modal.prompt('ویرایش','',it.text);if(!v)return;it.text=v;Store.save();this.render()},
  async remove(scope,i){const it=Store.data.goals[scope][i];const ok=await Modal.confirm('حذف','«'+Fmt.esc(it.text)+'»?',{danger:true,confirmText:'حذف'});if(!ok)return;Store.data.goals[scope].splice(i,1);Store.save();this.render();UI.updateGlobalStats()},
  async addSubtask(scope,i){const it=Store.data.goals[scope][i];if(!it.subtasks)it.subtasks=[];const t=await Modal.prompt('زیرتسک','','',{placeholder:'بخش جدید'});if(!t)return;it.subtasks.push({text:t,done:false});Store.save();this.render()},
  toggleSub(scope,i,si){Store.data.goals[scope][i].subtasks[si].done=!Store.data.goals[scope][i].subtasks[si].done;Store.save();this.render()},
  delSub(scope,i,si){Store.data.goals[scope][i].subtasks.splice(si,1);Store.save();this.render()},
  async setEstimate(scope,i){const it=Store.data.goals[scope][i];const cur=Store.estimateOf(it);const v=await Modal.prompt('تخمین زمان','H:MM — برای حذف تخمین 0 وارد کن',cur?Fmt.hm(cur):'',{placeholder:'2:00',durationPreview:true});if(v===null)return;if(!v||v==='0'){it.estimated_min=null;Store.save();this.render();Toast.info('تخمین حذف شد');return}try{it.estimated_min=Fmt.parseMins(v);Store.save();this.render();Toast.success('تخمین ثبت شد')}catch(e){Toast.error('فرمت اشتباه')}},
  async setTarget(scope,i){const it=Store.data.goals[scope][i];const v=await Modal.prompt('هدف زمانی','H:MM',it.targetMinutes?Fmt.hm(it.targetMinutes):'0',{placeholder:'2:00',durationPreview:true});if(!v){it.targetMinutes=0;Store.save();this.render();return}try{it.targetMinutes=Fmt.parseMins(v);Store.save();this.render()}catch(e){Toast.error('فرمت اشتباه')}},
  async setTag(scope,i){const it=Store.data.goals[scope][i];if(!Store.data.tags.length){Toast.info('اول تگ بساز');return}const items=[{label:'— بدون تگ —',value:null}].concat(Store.data.tags.map(t=>({label:t,value:t})));const v=await Modal.picker(items,it.tag,1);if(v===undefined)return;it.tag=v;Store.save();this.render()},
  async clearAll(scope){if(!Store.data.goals[scope]||!Store.data.goals[scope].length){Toast.info('خالیه');return}const ok=await Modal.confirm('حذف همه','همه حذف بشن؟',{danger:true,confirmText:'حذف'});if(!ok)return;Store.data.goals[scope]=[];Store.save();this.render();UI.updateGlobalStats()},
  syncRecurring(){
    const t=Cal.today();const td=Fmt.dateKey(t.y,t.m,t.d);
    if(Store.data.lastRecurringSync===td)return;Store.data.lastRecurringSync=td;
    const rec=Store.data.goals.recurring||[];if(!rec.length)return;
    if(!Array.isArray(Store.data.goals.dailyArchive))Store.data.goals.dailyArchive=[];
    // BUG-3: yesterday's clones are archived instead of permanently blocking today's re-creation
    const keep=[];
    (Store.data.goals.daily||[]).forEach(d=>{
      if(d.fromRecurring===undefined||d.fromRecurring===null){keep.push(d);return}
      if(d.dateKey===td){keep.push(d);return}
      Store.data.goals.dailyArchive.push(d);
    });
    if(Store.data.goals.dailyArchive.length>500)Store.data.goals.dailyArchive=Store.data.goals.dailyArchive.slice(-500);
    Store.data.goals.daily=keep;
    let added=0;
    rec.forEach(rt=>{
      const ex=Store.data.goals.daily.some(d=>d.dateKey===td&&d.fromRecurring===rt.id);
      if(!ex){
        Store.data.goals.daily.push({text:rt.text,done:false,createdAt:new Date().toISOString(),dateKey:td,subtasks:rt.subtasks?JSON.parse(JSON.stringify(rt.subtasks)):[],targetMinutes:rt.targetMinutes||0,tag:rt.tag||null,fromRecurring:rt.id,streak:0});
        added++;
      }
      rt.lastAdded=td;
    });
    Store.save();if(added>0)Toast.info(added+' تسک تکرارشونده اضافه شد')
  }
};

/* ═══════ STATS PAGE WITH COMPARISON ═══════ */
Pages.Stats={
  init(){
    const sel=document.getElementById('stats-year');if(!sel)return;
    for(let y=YEAR_MIN;y<=YEAR_MAX;y++){const o=document.createElement('option');o.value=y;o.textContent=y;sel.appendChild(o)}
    sel.value=YEAR_DEFAULT;sel.onchange=()=>this.render();
    document.querySelectorAll('[data-stats-view]').forEach(b=>b.onclick=()=>{Store.data.ui.statsView=b.dataset.statsView;Store.save();this.render()});
  },
  render(){
    const view=Store.data.ui.statsView||'compare';
    document.querySelectorAll('[data-stats-view]').forEach(b=>b.classList.toggle('active',b.dataset.statsView===view));
    ['compare','metrics','monthly','weekly','yearly','variance'].forEach(v=>{const el=document.getElementById('stats-view-'+v);if(el)el.style.display=(v===view?'block':'none')});
    const sel=document.getElementById('stats-year');
    const year=sel?+sel.value:YEAR_DEFAULT;
    if(view==='compare')this.renderCompare(year);
    if(view==='metrics')this.renderMetrics(year);
    if(view==='monthly')this.renderMonthly(year);
    if(view==='weekly')this.renderWeekly();
    if(view==='yearly')this.renderHeatmap(year);
    if(view==='variance')this.renderVariance(year);
  },
  // 2r: re-render on viewport/orientation change. The observer is re-created for the new
  // node after each render and short-circuits when the width is unchanged, so a render
  // cannot loop.
  _observeCompare(){
    try{
      const wrap=document.getElementById('cmp-canvas-wrap');
      if(!wrap||!window.ResizeObserver)return false;
      const w=wrap.clientWidth;
      if(this._cmpRO&&this._cmpW===w)return true;
      this._cmpW=w;
      if(this._cmpRO)this._cmpRO.disconnect();
      let t=null;
      this._cmpRO=new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(()=>{try{
        if(Store.data&&Store.data.ui&&Store.data.ui.statsView==='compare')this.renderCompare(Cal.today().y);
      }catch(e){}},200)});
      this._cmpRO.observe(wrap);
      return true;
    }catch(e){return false}
  },
  renderCompare(year){
    const el=document.getElementById('stats-view-compare');if(!el)return;
    const mode=Store.data.ui.compareMode||'month';
    const modes=[{v:'day',l:'📅 روز قبل vs امروز'},{v:'week',l:'📆 هفته قبل vs این هفته'},{v:'month',l:'🗓 ماه قبل vs این ماه'},{v:'year',l:'📊 سال قبل vs امسال'}];
    const tabsHTML=modes.map(m=>'<button class="btn '+(mode===m.v?'btn-primary':'btn-ghost')+' btn-sm" data-cmp="'+m.v+'">'+m.l+'</button>').join('');
    el.innerHTML='<div class="compare-wrap"><div class="compare-tabs">'+tabsHTML+'</div><div id="cmp-canvas-wrap"><canvas id="cmp-chart"></canvas></div><div class="compare-legend" id="cmp-legend"></div><div class="compare-summary" id="cmp-summary"></div></div>';
    el.querySelectorAll('[data-cmp]').forEach(b=>{
      b.onclick=()=>{Store.data.ui.compareMode=b.dataset.cmp;Store.save();this.renderCompare(year)};
    });
    // Build data
    const t=Cal.today();
    let series1,series2,labels,label1,label2,yLabel;
    if(mode==='day'){
      const today=Cal.today();
      const yesterday=Cal.addDays(today,-1);
      const dk1=Fmt.dateKey(yesterday.y,yesterday.m,yesterday.d);
      const dk2=Fmt.dateKey(today.y,today.m,today.d);
      series1=Store.daySecondsByHour(dk1).map(s=>s/3600);
      series2=Store.daySecondsByHour(dk2).map(s=>s/3600);
      labels=[];for(let h=0;h<24;h++)labels.push(h+':00');
      label1=Fmt.pDate(yesterday.y,yesterday.m,yesterday.d);
      label2=Fmt.pDate(today.y,today.m,today.d);
      yLabel='ساعت کار';
    }else if(mode==='week'){
      const thisWeek=[];for(let i=6;i>=0;i--)thisWeek.push(Cal.addDays(t,-i));
      const prevWeek=[];for(let i=13;i>=7;i--)prevWeek.push(Cal.addDays(t,-i));
      series1=prevWeek.map(p=>Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d))/3600);
      series2=thisWeek.map(p=>Store.daySeconds(Fmt.dateKey(p.y,p.m,p.d))/3600);
      labels=thisWeek.map(p=>{const wd=(Cal.firstWeekday(p.y,p.m)+p.d-1)%7;return WEEKDAYS[wd]});
      label1='هفته قبل';
      label2='این هفته';
      yLabel='ساعت';
    }else if(mode==='month'){
      const thisMonth={y:t.y,m:t.m};
      let prevM=t.m-1,prevY=t.y;
      if(prevM<1){prevM=12;prevY--}
      const nDaysThis=Cal.daysInMonth(thisMonth.y,thisMonth.m);
      const nDaysPrev=Cal.daysInMonth(prevY,prevM);
      const maxDays=Math.max(nDaysThis,nDaysPrev);
      series1=[];series2=[];
      for(let d=1;d<=maxDays;d++){
        series1.push(d<=nDaysPrev?Store.daySeconds(Fmt.dateKey(prevY,prevM,d))/3600:0);
        series2.push(d<=nDaysThis?Store.daySeconds(Fmt.dateKey(thisMonth.y,thisMonth.m,d))/3600:0);
      }
      labels=[];for(let d=1;d<=maxDays;d++)labels.push(String(d));
      label1=MONTHS[prevM-1]+' '+prevY;
      label2=MONTHS[t.m-1]+' '+t.y;
      yLabel='ساعت';
    }else{
      const thisYear=t.y;const prevY=t.y-1;
      series1=[];series2=[];
      for(let m=1;m<=12;m++){
        series1.push(Store.monthSeconds(prevY,m)/3600);
        series2.push(Store.monthSeconds(thisYear,m)/3600);
      }
      labels=MONTHS.map(m=>m.slice(0,3));
      label1=String(prevY);
      label2=String(thisYear);
      yLabel='ساعت';
    }
    const sum1=series1.reduce((a,b)=>a+b,0);
    const sum2=series2.reduce((a,b)=>a+b,0);
    const diff=sum2-sum1;
    const diffPct=sum1>0?Math.round(diff/sum1*100):(sum2>0?100:0);
    const diffCls=diff>0?'up':diff<0?'down':'';
    const diffSign=diff>0?'+':'';
    const sumEl=document.getElementById('cmp-summary');
    if(sumEl)sumEl.innerHTML=
      '<div class="compare-card"><div class="compare-card-label">'+Fmt.esc(label1)+'</div><div class="compare-card-val">'+sum1.toFixed(2)+'h</div></div>'+
      '<div class="compare-card"><div class="compare-card-label">'+Fmt.esc(label2)+'</div><div class="compare-card-val" style="color:var(--brand)">'+sum2.toFixed(2)+'h</div></div>'+
      '<div class="compare-card"><div class="compare-card-label">تفاوت</div><div class="compare-card-val '+(diffCls==='up'?'good':diffCls==='down'?'warn':'')+'" style="color:'+(diff>0?'var(--success)':diff<0?'var(--brand)':'var(--t3)')+'">'+diffSign+diff.toFixed(2)+'h</div><div class="compare-card-diff '+diffCls+'">'+(diffPct>0?'+':'')+diffPct+'%</div></div>';
    // Draw
    setTimeout(()=>{
      const cv=document.getElementById('cmp-chart');
      this._observeCompare();
      if(!cv)return;
      const geom=Chart.forCanvas(cv,Math.max(series1.length,series2.length));
      const W=geom.cssW,H=geom.cssH;
      cv.width=Math.round(W*geom.dpr);cv.height=Math.round(H*geom.dpr);
      cv.style.width=W+'px';cv.style.height=H+'px';
      cv.setAttribute('data-css-w',String(W));
      const ctx=cv.getContext('2d');
      if(ctx.setTransform)ctx.setTransform(geom.dpr,0,0,geom.dpr,0,0);   // draw in CSS px
      const PL=60,PR=20,PT=30,PB=48;
      const cW=W-PL-PR,cH=H-PT-PB;
      const maxVal=Math.max(...series1,...series2,0.1);
      const step=maxVal<=2?0.5:maxVal<=5?1:maxVal<=10?2:Math.ceil(maxVal/6);
      const yMax=Math.ceil(maxVal/step)*step;
      const yPx=v=>PT+cH-(v/yMax)*cH;
      // label/tick colour: #71717a measured only 4.09:1 on the dark chart background
      // (below the 4.5:1 AA threshold for normal text); #a1a1aa is 7.72:1
      const t3='#a1a1aa';
      const t0='#fafafa';
      // Grid
      ctx.font=geom.font+'px JetBrains Mono, monospace';
      for(let tick=0;tick<=yMax+1e-9;tick+=step){
        const y=yPx(tick);
        ctx.strokeStyle='rgba(255,255,255,.06)';
        ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle=t3;ctx.textAlign='right';ctx.textBaseline='middle';
        ctx.fillText(tick.toFixed(1)+'h',PL-6,y);
      }
      // Axes
      ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(PL,PT);ctx.lineTo(PL,PT+cH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(PL,PT+cH);ctx.lineTo(W-PR,PT+cH);ctx.stroke();
      // Y label
      ctx.save();ctx.translate(14,PT+cH/2);ctx.rotate(-Math.PI/2);
      ctx.fillStyle=t3;ctx.font=geom.font+'px Vazirmatn, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(yLabel,0,0);ctx.restore();
      // Draw a line + fill
      const drawLine=(vals,color,fillAlpha)=>{
        if(!vals.length)return;
        const n=vals.length;
        const xStep=cW/(n-1||1);
        // fill
        ctx.beginPath();
        ctx.moveTo(PL,yPx(0));
        vals.forEach((v,i)=>{ctx.lineTo(PL+i*xStep,yPx(v))});
        ctx.lineTo(PL+(n-1)*xStep,yPx(0));
        ctx.closePath();
        ctx.fillStyle=color.replace('#','rgba(').length===0?color:hexToRgba(color,fillAlpha);
        ctx.fill();
        // line
        ctx.beginPath();
        vals.forEach((v,i)=>{
          const x=PL+i*xStep,y=yPx(v);
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        });
        ctx.strokeStyle=color;ctx.lineWidth=geom.lineW;ctx.stroke();
        // dots
        vals.forEach((v,i)=>{
          const x=PL+i*xStep,y=yPx(v);
          if(n>30&&i%3!==0&&i!==n-1)return;
          ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
          ctx.fillStyle=color;ctx.fill();
          ctx.strokeStyle='#101012';ctx.lineWidth=1.5;ctx.stroke();
        });
      };
      const hexToRgba=(hex,a)=>{
        const h=hex.replace('#','');
        const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
        return 'rgba('+r+','+g+','+b+','+a+')';
      };
      // Series 1 (previous) - blue
      drawLine(series1,'#3b82f6',0.12);
      // Series 2 (current) - brand pink
      drawLine(series2,'#ff3d5e',0.18);
      // X labels
      ctx.fillStyle=t3;ctx.font=geom.font+'px Vazirmatn, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      const n=labels.length;
      const xStep=cW/(n-1||1);
      const step2=Math.max(1,Math.ceil(n/12));
      labels.forEach((lb,i)=>{
        if(i%step2!==0&&i!==n-1)return;
        const x=PL+i*xStep;
        ctx.fillText(lb,x,PT+cH+8);
      });
      // Legend
      const leg=document.getElementById('cmp-legend');
      if(leg)leg.innerHTML=
        '<div class="compare-legend-item"><div class="compare-legend-swatch" style="background:#3b82f6"></div>'+Fmt.esc(label1)+'</div>'+
        '<div class="compare-legend-item"><div class="compare-legend-swatch" style="background:#ff3d5e"></div>'+Fmt.esc(label2)+'</div>';
    },40);
  },
  renderMetrics(year){
    const dk2tags={};

      if(!l.ts)return;

      const p=Cal.fromGregorian(d.getFullYear(),d.getMonth()+1,d.getDate());
      if(p.y!==year)return;
      const dk=Fmt.dateKey(p.y,p.m,p.d);
      if(!dk2tags[dk])dk2tags[dk]=[];
      dk2tags[dk].push({tag:l.tag,ts:l.ts});
    }));
    const switchCounts=[];
    Object.values(dk2tags).forEach(arr=>{arr.sort((a,b)=>a.ts.localeCompare(b.ts));let c=0;for(let i=1;i<arr.length;i++)if(arr[i].tag!==arr[i-1].tag)c++;switchCounts.push(c)});
    const avgSwitch=switchCounts.length?Math.round(switchCounts.reduce((a,b)=>a+b,0)/switchCounts.length):0;
    const allLogs=Store.allLogs().filter(l=>{if(!l.ts)return false;const d=new Date(l.ts);return Cal.fromGregorian(d.getFullYear(),d.getMonth()+1,d.getDate()).y===year});
    const deepMins=allLogs.filter(l=>(l.seconds||l.minutes*60)>=25*60).reduce((a,l)=>a+(l.seconds||l.minutes*60),0)/60;
    const totalMins=allLogs.reduce((a,l)=>a+(l.seconds||l.minutes*60),0)/60;
    const deepRatio=totalMins?Math.round(deepMins/totalMins*100):0;
    const hourTotals={};
    allLogs.forEach(l=>{if(!l.ts)return;const h=new Date(l.ts).getHours();hourTotals[h]=(hourTotals[h]||0)+(l.seconds||l.minutes*60)});
    const bestHour=Object.entries(hourTotals).sort((a,b)=>b[1]-a[1])[0];

      '<div class="metric-card"><div class="metric-label">Deep Work</div><div class="metric-value '+(deepRatio>=50?'good':deepRatio>=25?'accent':'warn')+'">'+deepRatio+'%</div><div class="metric-sub">'+deepMins.toFixed(1)+'h از '+totalMins.toFixed(1)+'h</div></div>'+
      '<div class="metric-card"><div class="metric-label">ساعت اوج</div><div class="metric-value accent">'+bestHourStr+'</div><div class="metric-sub">'+(bestHour?(bestHour[1]/3600).toFixed(1)+'h کار':'—')+'</div></div>'+
