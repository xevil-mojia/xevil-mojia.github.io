    this.a('addDays 1404/12/29 +1 = 1405/01/01 (non-leap year)',nxt2.y===1405&&nxt2.m===1&&nxt2.d===1);
    const nxt3=Cal.addDays({y:1403,m:12,d:29},1);
    this.a('addDays 1403/12/29 +1 = 1403/12/30',nxt3.y===1403&&nxt3.m===12&&nxt3.d===30);
    let gOk=true;
    for(let y=2026;y<=2030;y++){
      for(let m=1;m<=12;m++){
        const p=Cal.fromGregorian(y,m,1);
        const g=Cal.toGregorian(p.y,p.m,p.d);
        if(g.gy!==y||g.gm!==m||g.gd!==1){gOk=false;break}
      }
      if(!gOk)break;
    }
    this.a('Gregorian round-trip 2026-2030',gOk);
    const k1=Cal.fromGregorian(2026,3,21);
    this.a('2026-03-21 = 1405/01/01',k1.y===1405&&k1.m===1&&k1.d===1);
    const k2=Cal.fromGregorian(2027,3,21);
    this.a('2027-03-21 = 1406/01/01',k2.y===1406&&k2.m===1&&k2.d===1);
    this.a('parseMins 1:30',Fmt.parseMins('1:30')===90);
    this.a('parseMins 2.5',Fmt.parseMins('2.5')===150);
    this.a('parseMins 1:30:30',Fmt.parseMins('1:30:30')===91);
    try{Fmt.parseMins('abc');this.a('invalid throws',false)}catch(e){this.a('invalid throws',true)}
    try{Fmt.parseMins('1:99');this.a('bad minutes throws',false)}catch(e){this.a('bad minutes throws',true)}
    this.a('hm(90)=1:30',Fmt.hm(90)==='1:30');
    this.a('hhmmss(3661)=01:01:01',Fmt.hhmmss(3661)==='01:01:01');
    this.a('dur(45)=45 ثانیه',Fmt.dur(45)==='45 ثانیه');
    this.a('dur(90)=1:30 دقیقه',Fmt.dur(90)==='1:30 دقیقه');
    this.a('dur(3700)=1:01',Fmt.dur(3700)==='1:01');
    const o1={b:1,a:2};const o2={a:2,b:1};
    this.a('canonicalize',JSON.stringify(canonicalize(o1))===JSON.stringify(canonicalize(o2)));

    const p=this._r.filter(x=>x.ok).length;const t=this._r.length;
    console.group('🧪 Tests: '+p+'/'+t);
    this._r.forEach(x=>{if(x.ok)console.log('✅',x.n);else console.error('❌',x.n)});
    console.groupEnd();
    Toast.show('🧪 '+p+'/'+t,p===t?'success':'warning',{duration:4000});
    return {passed:p,total:t};
  }
};

/* ═══════ EVENTS ═══════ */
function bindEvents(){
  document.querySelectorAll('.nav-item').forEach(b=>{b.onclick=()=>Router.go(b.dataset.page)});
  document.body.addEventListener('click',e=>{
    const ab=e.target.closest('[data-action]');
    if(ab){
      const a=ab.dataset.action;
      const map={
        'new-session':()=>Pages.Timer.newSession(),'new-tag':()=>Pages.Timer.newTag(),'start':()=>Timer.start(),'pause':()=>Timer.pause(),'stop':()=>Timer.stop(),
        'manual-log':()=>Pages.Timer.manualLog(),'assign':()=>Pages.Timer.assignToCalendar(),'quick-start':()=>Pages.Timer.quickStart(),
        'backup':()=>App.backup(),'restore':()=>App.restore(),'reset-all':()=>App.resetAll(),
        'export-csv':()=>Exporter.CSV(),'export-pdf':()=>Exporter.PDF(),'show-help':()=>Help.show(),
        'cal-prev':()=>Pages.Calendar.prev(),'cal-next':()=>Pages.Calendar.next(),'cal-today':()=>Pages.Calendar.today(),
        'pick-year':()=>Pages.Calendar.pickYear(),'pick-month':()=>Pages.Calendar.pickMonth(),
        'tl-prev':()=>Pages.Timeline.prev(),'tl-next':()=>Pages.Timeline.next(),'tl-today':()=>Pages.Timeline.today(),'tl-pick':()=>Pages.Timeline.pickDate(),
        'journal-today':()=>Pages.Journal.today(),'logs-clear-filters':()=>Pages.Logs.clearFilters(),'logs-export':()=>Pages.Logs.exportCSV(),
        'run-tests':()=>Tests.run()
      };
      if(map[a])map[a]();
      return;
    }
    const gt=e.target.closest('[data-goals-tab]');
    if(gt){Store.data.ui.goalsTab=gt.dataset.goalsTab;Store.save();Pages.Goals.render();return}
    const tt=e.target.closest('[data-trash-tab]');
    if(tt){Pages.Trash.setTab(tt.dataset.trashTab);return}
    const tm=e.target.closest('[data-timer-mode]');
    if(tm){Timer.setMode(tm.dataset.timerMode);return}
    const sv=e.target.closest('[data-stats-view]');
    if(sv){Store.data.ui.statsView=sv.dataset.statsView;Store.save();Pages.Stats.render();return}
  });
  const ss=document.getElementById('sess-search');
  if(ss)ss.addEventListener('input',e=>{clearTimeout(Pages.Timer._searchTimer);Pages.Timer._searchTimer=setTimeout(()=>{Pages.Timer._search=e.target.value;Pages.Timer.renderSessions()},150)});
  const bt=document.getElementById('bulk-toggle');
  if(bt)bt.onclick=()=>{Store.data.ui.bulkMode=!Store.data.ui.bulkMode;Store.save();bt.classList.toggle('active',Store.data.ui.bulkMode);Pages.Timer._selectedIds.clear();Pages.Timer.renderSessions();Pages.Timer.renderBulkBar()};
  ['lf-search','lf-tag','lf-session','lf-type'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const ev=id==='lf-search'?'input':'change';el.addEventListener(ev,()=>{if(id==='lf-search'){clearTimeout(Pages.Logs._t);Pages.Logs._t=setTimeout(()=>Pages.Logs._applyFilters(),150)}else Pages.Logs._applyFilters()})});
  const ts=document.getElementById('topbar-search');
  if(ts){ts.onclick=()=>Palette.open();ts.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();Palette.open()}}}
  const themeBtn=document.getElementById('theme-toggle');
  if(themeBtn)themeBtn.onclick=()=>{UI.toggleTheme();if(Store.data.ui.page==='settings')Pages.Settings.render()};
  const focusBtn=document.getElementById('focus-btn');
  if(focusBtn)focusBtn.onclick=()=>{UI.toggleFocus();if(Store.data.ui.page==='settings')Pages.Settings.render()};
  const pipBtn=document.getElementById('pip-btn');
  if(pipBtn)pipBtn.onclick=()=>PiP.toggle();
  document.addEventListener('keydown',e=>{
    const t=e.target;const typing=t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Palette.open();return}
    if(e.key==='Escape'){if(Palette._open){Palette.close();return}if(Modal._stack.length){Modal._stack[Modal._stack.length-1]();return}if(Store.data.settings.focusMode){UI.toggleFocus();return}return}
    if(typing)return;
    if(Modal._stack.length||Palette._open)return;
    if(e.key==='?'||(e.shiftKey&&e.key==='/')){e.preventDefault();Help.show();return}
    if(e.code==='Space'){e.preventDefault();if(Store.data.timer.running)Timer.pause();else Timer.start();return}
    if(e.key==='q'||e.key==='Q'){e.preventDefault();Pages.Timer.quickStart();return}
    if(e.key==='f'||e.key==='F'){e.preventDefault();UI.toggleFocus();return}
    if(e.key==='p'||e.key==='P'){e.preventDefault();PiP.toggle();return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();App.backup();return}
    if(!e.ctrlKey&&!e.altKey&&!e.metaKey){const m={'1':'timer','2':'timeline','3':'logs','4':'calendar','5':'journal','6':'goals','7':'stats'};if(m[e.key])Router.go(m[e.key])}
  });
  window.addEventListener('beforeunload',e=>{if(Store.data.timer.running){Store.data.timer.elapsed=Timer.elapsed();Store.data.timer.startedAt=Date.now();try{localStorage.setItem(STORE_KEY,JSON.stringify(Store.data))}catch(err){}const secs=Timer.elapsed();if(secs>60){e.preventDefault();e.returnValue='تایمر در حال اجراست';return e.returnValue}}});
  Bus.on('timer-start',()=>{UI.updateControls();TitleBar.update()});
  Bus.on('timer-pause',()=>{UI.updateControls();TitleBar.update()});
  Bus.on('timer-stop',()=>{UI.updateControls();UI.updateGlobalStats();TitleBar.update()});
  Bus.on('save',()=>UI.showSaveIndicator('saving'));
  Bus.on('saved',()=>UI.showSaveIndicator('saved'));
}

setInterval(()=>{if(Store.data.timer.running){Store.data.timer.elapsed=Timer.elapsed();Store.data.timer.startedAt=Date.now();Store.save()}},30000);
setInterval(()=>{if(Store.data.timer.running)TitleBar.update()},1000);
setInterval(()=>UI.updateAtRisk(),60000);
setInterval(()=>{try{Pages.Goals.syncRecurring()}catch(e){}},5*60*1000);
let lastDate=Fmt.dateKey(Cal.today().y,Cal.today().m,Cal.today().d);
setInterval(()=>{const today=Cal.today();const todayDk=Fmt.dateKey(today.y,today.m,today.d);if(todayDk!==lastDate){lastDate=todayDk;Pages.Goals.syncRecurring();UI.updateGlobalStats()}},60000);

async function boot(){
  try{
    await Store.load();
    Store.cleanupTrash();
    UI.applyTheme();
    document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&Store.data.settings.focusMode){Store.data.settings.focusMode=false;Store.save();document.body.classList.remove('focus-mode');const btn=document.getElementById('focus-btn');if(btn)btn.classList.remove('active')}});
    Idle.init();
    if(Store.data.settings.focusMode)document.body.classList.add('focus-mode');
    const t=Cal.today();
    if(!Store.data.ui.calY||Store.data.ui.calY<YEAR_MIN||Store.data.ui.calY>YEAR_MAX){
      Store.data.ui.calY=Math.max(YEAR_MIN,Math.min(YEAR_MAX,t.y));
      Store.data.ui.calM=t.m;
    }
    if(!Store.data.ui.activeSessionId&&Store.data.sessions.length)Store.data.ui.activeSessionId=Store.data.sessions[0].id;
    if(!Store.data.ui.activeTag&&Store.data.tags.length)Store.data.ui.activeTag=Store.data.tags[0];
    const tr=Store.data.timer;
    if(tr.sessionId&&!Store.data.sessions.find(s=>s.id===tr.sessionId)){tr.running=false;tr.startedAt=null;tr.elapsed=0;tr.sessionId=null;tr.tag=null}
    try{Pages.Goals.syncRecurring()}catch(e){console.error(e)}
    bindEvents();
    Pages.Stats.init();
    UI.updateGlobalStats();
    const bt=document.getElementById('bulk-toggle');if(bt)bt.classList.toggle('active',Store.data.ui.bulkMode);
    const fb=document.getElementById('focus-btn');if(fb)fb.classList.toggle('active',Store.data.settings.focusMode);
    Router.go(Store.data.ui.page||'timer');
    if(tr.running&&tr.startedAt){const el=(Date.now()-tr.startedAt)/1000;tr.elapsed=(tr.elapsed||0)+Math.floor(el);tr.startedAt=Date.now();Timer._interval=setInterval(()=>Timer._tick(),250);UI.updateControls();TitleBar.update()}
    else{UI.updateClock();UI.updateControls()}
    window.MoJiaTests=()=>Tests.run();
    window.MoJiaStore=Store;
  }catch(e){console.error('Boot failed',e);const banner=document.getElementById('error-banner');if(banner){banner.textContent='⚠ خطا: '+e.message;banner.style.display='block'}}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
